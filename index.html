{"ID":"016-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"맏이","漢字源（Hanja）":"","詞性":"名","中文意義":"老大","韓文例句":"이래 봬도 7형제(의) 맏이.","例句中文":"就算看起來這樣，他畢竟是七個孩子裡最大的。","目標中文":"最大的","延伸單字":"형제 (兄弟) / 자매 (姊妹) / 남매 (男妹：兄弟姊妹)","詳細解說":"最年長的。從兄弟姊妹的角度來看的「大哥」稱為맏이，從父母的角度來看則稱為맏아들。「大姊」稱為맏언니或맏딸，「大兒媳婦」稱為맏며느리。如果你有兩個哥哥，就是큰형（大的哥哥）和작은형（小的哥哥）。如果有三個人，也可以分別稱為첫째형（大哥）、둘째형（二哥）、셋째형（三哥）。這些兄弟姊妹的名字不僅用於親兄弟姊妹之間，也用於偶像團體內部。"}

{"ID":"017-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"막내","漢字源（Hanja）":"","詞性":"名","中文意義":"老么*","韓文例句":"잘했어, 우리 막내.","例句中文":"做得好呀，我們家的忙內。","目標中文":"忙內","延伸單字":"막둥이 (老么（暱稱）) / 늦둥이 (晚年得子的子) / 막내 직원 (最年輕的員工) / 막내 작가 (最年輕的作家)","詳細解說":"「最小的兒子」是「막내아들」，「最小的女兒」是「막내딸」。稱呼年紀較大的人會根據性別使用不同的名稱，稱呼年紀較小的人則不太會在意性別。儘管不同性別也有特定的稱呼，例如「남동생（弟弟）」和「여동생（妹妹）」，「조카（姪子／外甥）」和「조카딸（姪女／外甥女）」，以及「손자（孫子）」和「손녀딸（孫女）」，但經常會簡單稱呼為「우리 동생（我家小弟／小妹）」，或是「우리 조카（我家外甥／姪兒）」。這些表達方式無法直接翻譯，因為中文中只有特定性別的名稱。「막내也用於公司等組織中最年輕的人或下屬。"}

{"ID":"018-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"친구","漢字源（Hanja）":"親舊","詞性":"名","中文意義":"朋友，好友*","韓文例句":"나랑 친구 하고 싶다고요?","例句中文":"你想和我當朋友嗎？","目標中文":"朋友","延伸單字":"고향 친구 (同鄉朋友) / 소꿉친구 (青梅竹馬) / 중학교 동창 (中學同學)","詳細解說":"不只朋友，同年齡（同輩）的人有時也可以稱為「친구」。當一位前輩對後輩說「내가 니 친구냐?」（我不是你的朋友＝我跟你不是同齡吧？）時，就是斥責後輩豈能把長輩當成同輩的意思。由於친구是與年齡相關的詞，所以不同年齡的朋友被稱為「친한 언니（親近的前輩）」和「친한 동생（親近的後輩）」。這個詞也可用來友善稱呼小於同輩的人，例如「저 친구는（那個傢伙啊）」、「착한 친구야（他是個好孩子）」。"}

{"ID":"019-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"또래","漢字源（Hanja）":"","詞性":"名","中文意義":"同輩","韓文例句":"같은 또래끼리 친하게 지내요.","例句中文":"我們是同一代的同輩，好好相處吧。","目標中文":"同一代的同輩","延伸單字":"동갑 (同甲：同年) / 띠동갑 (同生肖、相差一輪)","詳細解說":"「同齡人，同代人」是「또래」。要說「我們這一代」時，就可以說「우리 (저희) 나이 또래」。「저희 나이 또래는 흔히 MZ 세대라고 하죠.」（我們這一代通常被稱為MZ世代（80年代到2000年代末期出生的人）。「同一代的男孩」是「또래 남자들」，「同一代的女孩」是「또래 여자들」。「또래 여자들은 다 케이 팝 팬이에요.」（我這一代的所有女生都是韓流粉絲。）"}

{"ID":"020-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"아저씨","漢字源（Hanja）":"","詞性":"名","中文意義":"大叔","韓文例句":"저 아저씨 아니거든요.","例句中文":"雖然我才不是什麼大叔。","目標中文":"大叔","延伸單字":"할아버지 (爺爺) / 할머니 (奶奶)","詳細解說":"由於許多情況下無法使用第二人稱代名詞「너」（你：上對下、親近的人）和「당신」（你：尊稱），因此通常使用親屬稱謂代替第二人稱。以成年男性來說，未婚男性被稱為「총각（總角）」，已婚男性被稱為「아저씨」。然而，年輕人不太使用「총각」一詞，所以即使是大學生有時也被稱為「아저씨」。對於老年男性，則使用尊稱「他人的父母」的「어르신」（어른（大人）的敬稱）。"}

{"ID":"021-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"학생","漢字源（Hanja）":"學生","詞性":"名","中文意義":"同學","韓文例句":"거기 학생 잠깐 서 봐.","例句中文":"那邊的同學，請稍等一下。","目標中文":"同學","延伸單字":"《俗》꼬맹이 (小傢伙)","詳細解說":"雖然我們一般不會用「同學」當作稱謂，但也可以在要叫住某人的時候使用「학생」。這是一個針對年輕人，特別是國中生和高中生使用的稱呼。也可以用來稱呼學生為「某某同學」。「김남준 학생, 다음 문제 풀어 보세요.」（金南俊同學，請解開以下問題。）對年齡低於小學生的孩子說「你幾歲呀？」、「你在吃什麼呀？」的「你」，則會用「꼬마」（小朋友）表示。"}

{"ID":"022-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"삼촌","漢字源（Hanja）":"三寸","詞性":"名","中文意義":"叔叔","韓文例句":"줘봐, 삼촌이 해 줄게.","例句中文":"給我吧，叔叔幫你開。","目標中文":"叔叔","延伸單字":"외삼촌 (外三寸：舅舅) / 사촌 (四寸：堂表親=堂／表兄弟姊妹)","詳細解說":"未婚的叔叔稱為「삼촌（三寸）」。「三寸」的意思是「三等親」。在首爾方言中，它的發音為「삼춘」，所以你可能會常在電視劇和電影中聽到這樣的發音。如果叔叔結婚了，「父親的哥哥」的稱呼就會變成「큰아버지」，「父親的弟弟」的稱呼就會變成「작은아버지」。父方的親屬名稱往往分得比母方更細。"}

{"ID":"023-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"이모","漢字源（Hanja）":"姨母","詞性":"名","中文意義":"阿姨","韓文例句":"우리는 이모팬.","例句中文":"我們是一群姨母粉。","目標中文":"姨母","延伸單字":"사모님 (師母-：太太（意識到其丈夫職業的敬稱）) / 여사님 (女史-：女士，夫人（意識到該女性職業的敬稱）)","詳細解說":"嫗媪稱為「고모」，阿姨稱為「이모」。與父方親屬稱謂相比，母方的稱謂更有親切感，也更容易使用。正如我們會用兄弟姊妹來指稱他人，「삼촌」和「이모」有時也用來稱呼父母的朋友，或是年紀等同父母輩的親近人士。和偶像的年齡差距如同親子的粉絲可稱為「삼촌팬（叔叔粉）」和이모팬（姨母粉）」。「이모」也常以第二人稱詞出現，指稱餐廳裡的中年女員工。「아줌마」也是「阿姨」的意思，但正逐漸被更具表現力的詞彙取代。"}
,
{"ID":"024-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"부모님","漢字源（Hanja）":"父母","詞性":"名","中文意義":"父母親","韓文例句":"부모님 사랑해요.","例句中文":"我最愛爸爸媽媽了。","目標中文":"爸爸媽媽","延伸單字":"학부모 (學父母：家長)","詳細解說":"父母是「부모（父母）」。雖然還有個固有名詞「어버이」，但除了「어버이날」（韓國每年5月8日的父母節）之外很少使用。即使在談論自己的父母時，韓國人也會使用諸如「부모님이 주셨어요（我的父母親給我的）」之類的敬語。在成年後，對父母的第二人稱通常會改口為「어머니（母親）」和「아버지（父親）」，但近年來也有不少人繼續稱呼「엄마（媽媽）」和「아빠（爸爸）」。但如果是別人的父母或姻親，則還是要稱「어머니」或「어머님」，「아버지」或「아버님」。"}

{"ID":"025-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"선생님","漢字源（Hanja）":"先生","詞性":"名","中文意義":"先生，老師","韓文例句":"선생님 경찰서로 가시죠.","例句中文":"先生，要麻煩您跟我們去警局一趟。","目標中文":"先生","延伸單字":"사장님 (社長：社長、總經理（對於年長男性的敬稱）)","詳細解說":"年輕一代有時會省略「선생님」，將親近的老師稱為「쌤」。然而，無論你和老師有多親近，都還是要對他們使用敬語。當與陌生人打交道時，或是在政府機關窗口、當警察與公民打交道時，因為沒有合適的第二人稱，也會使用「선생님」。在電視劇《魷魚遊戲》中，西裝男（孔劉飾）初次向主角成奇勳（李政宰飾）搭話時，也是使用「선생님」。年齡差距相當於父母的前輩不稱為「선배님（先輩）」，而是稱為「선생님」。稱呼中老年人也可以用「아버님（伯父）」和「어머님（伯母）」。"}

{"ID":"026-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"언니","漢字源（Hanja）":"","詞性":"名","中文意義":"姊姊*","韓文例句":"내가 직장 왕언니(가) 됐다...","例句中文":"我變成職場上的老大姊了（女性中最年長者）。","目標中文":"老大姊","延伸單字":"-","詳細解說":"女性用來稱呼姊姊或親密女性長輩的稱謂。女性的關係往往比較平等，和男性稱「형」（哥）相比，「언니」更容易稱呼。不過，還請考慮一下年齡差異。如果年齡差距如同姊妹的話就可以稱為「언니」，如果差距等同父母的話則稱為「이모」。關係親密的女性有時也會稱對方為「자기（自己：親愛的）」。「자기 점심은 밖에서 먹을 거야?」（親愛的，要去外面吃午餐嗎？）「자기」也用於夫妻和情侶之間。"}

{"ID":"027-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"형님","漢字源（Hanja）":"兄-","詞性":"名","中文意義":"大姊","韓文例句":"형님이 계셔서 너무 든든해요.","例句中文":"有大姊在這裡，讓我覺得很放心。","目標中文":"大姊","延伸單字":"-","詳細解說":"「누나」的敬稱是「누님」，尊稱「언니」則要用「형」的敬稱「형님」。韓國人並不常稱呼關係親密的年長女性為「형님」，而是用來稱呼丈夫的姐姐，或是丈夫的哥哥的妻子等，類似「嫂子」這樣的說法。但如果是自己家的大嫂（自己哥哥的妻子），則稱為「새언니（新的姊姊）」或「올케언니」（올케的意思是오라버니（哥哥）的계집（女人）），而非「형님」。比起自家親戚，對夫家親戚的稱謂要求會更嚴格。※男性之間稱呼「老大哥」也用「형님」。"}

{"ID":"028-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"신랑","漢字源（Hanja）":"新郞","詞性":"名","中文意義":"先生（丈夫）","韓文例句":"오늘은 우리 신랑 생일.","例句中文":"今天是我先生的生日。","目標中文":"先生","延伸單字":"낭군 (郞君※時代劇用語) / 장가가다 (娶妻) / 유부남 (有婦男：已婚男人、有婦之夫) / 예비아빠 (豫備-：準爸爸)","詳細解說":"當妻子向第三人談起自己的丈夫時，會使用「남편（男便）」或「신랑（新郎）」。在非正式場合，年長的丈夫有時會稱為「오빠」。孩子出生後，丈夫會變成「애 아빠（孩子他爸）」，妻子會變成「애 엄마（孩子他媽）」。不限於第三人，夫妻之間也會互相稱呼「지민이 아빠（智旻他爸）」、「정국이 엄마（柾國他媽）」。※請注意：如果說「우리 아빠（我家爸爸）」，就是稱呼自己的父親，而非自己的丈夫。"}
,
{"ID":"029-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"와이프","漢字源（Hanja）":"wife","詞性":"名","中文意義":"太太（妻子）","韓文例句":"와이프한테 혼나요.","例句中文":"我要被老婆罵了。","目標中文":"老婆","延伸單字":"시집 (媤-：婆家) / 시집가다 (媤-：出嫁) / 유부녀 (有夫女：已婚女性、有夫之婦) / 예비엄마 (豫備-：準媽媽)","詳細解說":"丈夫稱妻子為「와이프」、「아내（妻子）」或「집사람（家裡的人）」。年輕夫婦會使用第二人稱「자기（親愛的）」或「오빠」，中年或老年夫婦則用「여보（老公／老婆）」或「당신（你）」。「당신」原本是第二人稱尊稱，但僅用於夫妻之間或書面語。除此之外，當兩人處於爭吵的狀態時，它會以口語的形式出現。「당신 아까 뭐라 그랬어?」（你剛剛說什麼？）※「準」的狀態則用「예비（豫備）」表現。訂婚時，就可以說「예비신랑（準新郎）」和「예비신부（準新娘）」。"}
,
{"ID":"030-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"마마보이","漢字源（Hanja）":"mamaboy","詞性":"名","中文意義":"媽寶男","韓文例句":"마마보이 남편과 아들바보 시어머니.","例句中文":"媽寶老公跟溺愛兒子的婆婆。","目標中文":"媽寶","延伸單字":"마마걸 (mamagirl：媽寶女)","詳細解說":"在儒家思想中，養育好兒子被視為母親的使命，因此母子之間的關係會趨於親密。依賴母親的兒子會被周遭的人瞧不起，稱為「마마보이（mamaboy）」。另一方面，溺愛兒子的父母被稱為「아들바보（兒子傻瓜）」。自戀的男人會表現得像他們自己是王子一樣，這就是為什麼他們被稱作「왕자병（王子病）」。換成女性，就是「공주병（公主病）」。溺愛女兒的父母則稱為「딸바보（女兒傻瓜）」。"}
,
{"ID":"031-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"유교보이","漢字源（Hanja）":"儒教boy","詞性":"名","中文意義":"儒家男孩","韓文例句":"노출을 꺼려하는 유교보이.","例句中文":"不願意暴露肌膚的儒家男孩。","目標中文":"儒家男孩","延伸單字":"보수남 (保守男) / 유교걸 (儒教girl)","詳細解說":"這個字是用來戲稱恪守儒家禮儀的保守男性。當一個人表現出彬彬有禮的行為舉止，或擔心暴露自己的肌膚時，就可能會被這樣說。如果某人的舉止「正經、謹慎」，則稱為「조신하다（操身-）」。「다리 모으고 조신하게 앉다」（雙腿併攏，正經八百地坐著）。對於女性，也會使用「참하다（文靜）」。相反地，形容「粗俗」則用「상스럽다（常-）」或「천박하다（淺薄-）」。"}
,
{"ID":"032-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"효자","漢字源（Hanja）":"孝子","詞性":"名","中文意義":"孝子","韓文例句":"효자 났네, 효자 났어.","例句中文":"超級孝順的人。","目標中文":"孝順的人","延伸單字":"효도 (孝道：孝行) / 효녀 (孝女：孝順的女兒) / 효자손 (孝子-：孝子的手＝不求人)","詳細解說":"某某經常打電話家裡，逢生日或連假就回家；某某人買了房子送給父母。之所以有這麼多這樣的軼事，是因為社會上存在一種尊孝的氛圍。「효자 났네」是對孝順之人的讚美，但根據上下文也可能具有諷刺意味。類似的表現還有「경사 났네, 경사 났어（可喜可賀）」。透過增加收視率和銷售量來為公司做出貢獻的行為，稱為「효자 노릇（孝子義務）」，商品則稱為「효자 상품（孝子商品）」。另一方面，強行要求家人孝順父母也被視為一個問題。"}
,
{"ID":"033-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"불효자","漢字源（Hanja）":"不孝子","詞性":"名","中文意義":"不孝子","韓文例句":"이런 불효자가 있나….","例句中文":"竟然有這種不孝子……","目標中文":"不孝子","延伸單字":"패륜아 (悖倫兒：違反道德倫常之人) / 막장부모 (-父母：狗血父母)","詳細解說":"不盡子女義務，或先於父母而死者，亦為不孝。「你這個不孝子！」就是「이 불효자식！」。不只是父母和子女，不遵守夫妻或兄弟姊妹的道德標準或觸犯禁忌的行為，都被稱為패륜（悖倫：違背做人的倫理）。電視劇《九轉時光的旅行》的主角，因為穿越時空改變了過去，導致女友變成了自己的姪女。他在劇中便說道，「만나면 패륜이 되거든.」（一旦我們交往，就會違反道德）。"}
,
{"ID":"034-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"초면","漢字源（Hanja）":"初面","詞性":"名","中文意義":"初次見面","韓文例句":"초면에 실례지만….","例句中文":"初次見面失禮了……","目標中文":"初次見面","延伸單字":"-","詳細解說":"「초면（初面）」的意思是「初次見面」。「這是我們第一次見面吧？」就是「우리 초면이죠?」。「陌生人，完全不認識的人」也被稱為「생판 모르는 사람」。使用到초的單字還有「初學者」——「초보（初步）」、「초보자（初學者）」，以及「新手、生手」——「초짜（初-）」。另一方面，「大師、高階者、老鳥」，則稱為「고수（高手）」。例如「게임의 고수（職業玩家）」、「고수가 나타났네.」（高手現身了）。"}
,
{"ID":"035-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"구면","漢字源（Hanja）":"舊面","詞性":"名","中文意義":"面熟","韓文例句":"우리 구면이죠?","例句中文":"我們是不是在哪裡碰過面？","目標中文":"碰過面","延伸單字":"-","詳細解說":"相反地，「구면（舊面）」指的是「故舊，以前見過的人」。同樣，使用到「구（舊）」一詞的單字還有「친구（親舊）」，意思是「老熟人，老朋友」。「見過面的人，認識的人」也被稱為「아는 사람（互相認識）」或「아는 사람（認識的人）」。「오랫동안 알고 지내다（認識很久了）」的意思則是「從以前就認識的熟人」。「以前」是「옛날」。民間故事開頭的「從前從前…」，在韓國則是用「호랑이 담배 피우던 시절…」（當老虎抽菸斗的時候）這個俗語來表達。"}
,
{"ID":"036-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"도깨비","漢字源（Hanja）":"","詞性":"名","中文意義":"鬼怪","韓文例句":"아저씨 도깨비 맞죠?","例句中文":"大叔，你是鬼怪吧？","目標中文":"鬼怪","延伸單字":"저승사자 (黃泉的使者＝死神) / 홀리다 (被迷惑，被欺騙)","詳細解說":"「도깨비」是韓國代表性的妖怪。據說牠會展現出超乎常人的力量，對人類惡作劇，也有一說鬼怪是由掃帚變成的。如同電視劇《孤單又燦爛的神－鬼怪》中，令人印象深刻的「메밀꽃（蕎麥花）」登場一樣，據說鬼怪也喜歡吃蕎麥麵。「술래잡기（鬼抓人）」、「숨바꼭질（捉迷藏）」、「무궁화 꽃이 피었습니다（木槿花開了）」（譯注：即《魷魚遊戲》中的「123木頭人」）等兒童遊戲中的「鬼」，則是「술래」。"}
,
{"ID":"037-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"귀신","漢字源（Hanja）":"鬼神","詞性":"名","中文意義":"鬼魂，幽靈","韓文例句":"귀신보다 무서운 게 사람이지.","例句中文":"人比鬼還可怕。","目標中文":"鬼","延伸單字":"-","詳細解說":"與電影和電視劇中經常出現的「좀비（殭屍）」不同，傳統的鬼魂被稱為「귀신（鬼神）」。韓國人也同樣害怕怨靈。他們相信，未婚青年死後會留在「이승（現世）」作惡。未婚女子的鬼魂被稱為「손각시或처녀귀신（處女鬼神）」，其特徵是身著白衣。如果是未婚男子，則被稱為「몽달귀신（-鬼神）」。「世上發生的不可思議、無法解釋的事」，在韓語中稱為「귀신이 곡할 노릇（就像鬼哭一樣）」。"}
,
{"ID":"038-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"얼굴","漢字源（Hanja）":"","詞性":"名","中文意義":"臉","韓文例句":"잘생긴 얼굴 보여 달라고요?","例句中文":"妳說想看看我帥氣的臉龐嗎？","目標中文":"臉龐","延伸單字":"맨얼굴 생얼굴 (素顏) / 얼굴형 (臉型) / 용안 (龍顏：君王的聖顏 ※時代劇用語)","詳細解說":"「얼굴 천재（臉蛋天才）」是用來稱呼擁有美麗面孔的藝人（例如ASTRO的車銀優）。沒有整形過的「天然帥哥」被稱為「자연산（自然產）」或「모태미남（母胎美男）」。對某人的臉很小感到驚訝，通常會握緊拳頭說「얼굴이 이만해（臉只有這麼大）」。「얼굴이 반쪽이 되다（臉變成一半）」就是「臉變瘦了」的意思。「人面廣」在韓語中則翻成「발이 넓다（腳很寬）」。「낯」也是「臉」的意思，「얼굴」原本則似乎是用來指整個身體。"}
,
{"ID":"039-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"머리","漢字源（Hanja）":"","詞性":"名","中文意義":"頭，頭髮","韓文例句":"머리 굴리는 리더.","例句中文":"絞盡腦汁（費盡心思）的隊長。","目標中文":"腦汁","延伸單字":"가르마 (頭髮的分邊) / 정수리 (頂-：髮旋，頭頂) / 구레나룻 (鬢角)","詳細解說":"「머리」也有「頭髮」的意思。這個字也用於直髮——「생머리（生-）」和貴賓狗般的捲髮——「뽀글 머리（小捲髮）」。韓語也會使用「금발（金髮）」、「은발（銀髮）」和「흑발（黑髮）」等漢字詞彙。「머리」有時還會用來當作通用語的後綴詞，例如「인정머리 없는 사람들（沒有人性的人）」、「저 못된 버르장머리（那個習慣＝沒禮貌的時候）」。「인정머리」是「인정（人性）」加上「머리」，「버르장머리」是「버릇（習慣）」加上「머리」。"}
,
{"ID":"040-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"쌍꺼풀","漢字源（Hanja）":"雙-","詞性":"名","中文意義":"雙眼皮","韓文例句":"쌍꺼풀이 진한 편이에요.","例句中文":"雙眼皮很明顯。","目標中文":"雙眼皮","延伸單字":"눈썹 (眉毛) / 속눈썹 (睫毛) / 눈꺼풀 (眼皮) / 속쌍꺼풀 (內雙)","詳細解說":"成雙（쌍）的「눈꺼풀（眼皮）」就是「쌍꺼풀（雙眼皮）」。在不久前的韓國，無論男性或女性，雙眼皮都被視為美麗的絕對象徵，「쌍꺼풀 성형 수술（雙眼皮整形手術）」也是「가장 흔한 수술（最普遍的手術）」。「雙眼皮很明顯」叫做「진한 쌍꺼풀（雙眼皮很深）」。張東健、元彬、金來沅、李敏鎬都是有明顯雙眼皮的代表性藝人。拼音跟雙眼皮很像的「커플」則是「夫妻／情侶」（couple）的意思。"}
,
{"ID":"041-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"무쌍","漢字源（Hanja）":"無雙","詞性":"名","中文意義":"單眼皮","韓文例句":"무쌍인데 눈이 커요.","例句中文":"雖然是單眼皮，但眼睛很大。","目標中文":"單眼皮","延伸單字":"-","詳細解說":"象徵2020年代的人氣帥哥主要都是「鹽系男」。宋仲基、朴寶劍、BTS防彈少年團的金碩珍等代表人物都是單眼皮。「單眼皮」也稱為「무쌍」或「무꺼풀」，是「무쌍꺼풀（無雙眼皮）」的縮寫。「單眼皮」也可以說成「쌍꺼풀이 없다（沒有雙眼皮）」，「雙眼皮」也可以說成「쌍꺼풀이 있다（有雙眼皮）」。說到將單眼皮魅力發揚光大的女性藝人，大概就是出演電視劇《鬼怪》的金高銀，還有出演電影《寄生上流》的朴素丹了。"}

{"ID":"042-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"눈매","漢字源（Hanja）":"","詞性":"名","中文意義":"眼神，眼形","韓文例句":"길쭉한 눈매.","例句中文":"細長的眼睛。","目標中文":"眼睛","延伸單字":"눈알 (眼珠) / 눈동자 (瞳孔) / 삼백안 (三白眼)","詳細解說":"清爽的「눈매」是典型的「핸섬페이스（帥臉，handsome face）」。「-매」是代表「形狀」的後綴詞，用於「몸매（體型）」等詞彙。以BTS的成員來比喻的話，像金泰亨這樣「細長的眼形」就是「길쭉한 눈매」；像田柾國的「圓（동그랗다）眼」就是「동그란 눈매」；閔其一笑就會「像線（실）一樣細長的眼睛」，則稱為「실눈」。「眼神」也叫做「눈빛」。「눈빛 연기」的意思就是「用眼睛演戲，訴諸眼神的演技」。"}

{"ID":"043-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"콧날","漢字源（Hanja）":"","詞性":"名","中文意義":"鼻樑","韓文例句":"오똑한 콧날","例句中文":"高挺的鼻樑。","目標中文":"鼻樑","延伸單字":"콧물 (鼻水) / 코를 풀다 (擤鼻子) / 코를 골다 (打鼾)","詳細解說":"「鼻樑」是「콧날」。「날」有「刀刃」的意思。像BTS的鄭號錫這樣的「高挺的鼻樑」被稱為「오똑한 콧날」。至於其他鼻子部位，「鼻柱」是「콧대」。「콧대를 꺾다（折斷鼻柱）」的意思就是「挫對方的銳氣」。「鼻翼」是「콧방울」，「鼻孔」是「콧구멍」，「鼻尖」是「코끝」。我們會說在眼前，但韓語則是說「鼻前」（코앞）。「목적지가 코앞인데…」（目的地就在眼前…）。"}

{"ID":"044-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"젖살","漢字源（Hanja）":"","詞性":"名","中文意義":"(小時候的) 嬰兒肥","韓文例句":"젖살 다 어디 갔어?","例句中文":"嬰兒肥消失到哪去了？","目標中文":"嬰兒肥","延伸單字":"앳되다 (顯得年輕)","詳細解說":"「젖살（吃奶長的肉）」指的是圓潤飽滿的臉頰。這是娃娃臉的象徵，會激發人的母性本能。「스무살 넘었는데 아직도 젖살이 안 빠졌어.」（明明已經超20歲了，臉上的嬰兒肥還是消不掉）。眼睛下方膨脹的部分則是「臥蠶」は「애교살（撒嬌肉）」。就算長了也不會開心的「肚肉」是뱃살。象徵疲憊和衰老的則有「다크서클（dark circle：黑眼圈）」、「잡티 기미（瑕疵，黑斑）」和「팔자주름（法令紋）」。"}

{"ID":"045-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"보조개","漢字源（Hanja）":"","詞性":"名","中文意義":"酒窩","韓文例句":"예쁜 보조개가 트레이드마크.","例句中文":"漂亮的酒窩就是招牌。","目標中文":"酒窩","延伸單字":"주근깨 (雀斑) / 점 (痣) / 여드름 (青春痘)","詳細解說":"說到BTS的金南俊，「보조개」就是他的招牌。「웃으면 쏙 들어가는 보조개.」（微笑時就會現出酒窩）。「臉頰」則叫做「볼」或「뺨」。「귀」（耳朵）相關的單字，還有「귓불」、「귀지」、「복스러운 귀」、「첫눈에 반하다」－「금시초문（今時初聞）」、「귓등」－「헛들음（誤聽）」、「토끼귀（兔耳朵）」－「식빵 자투리」等等。"}

{"ID":"046-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"입술","漢字源（Hanja）":"","詞性":"名","中文意義":"嘴唇","韓文例句":"입술 쭉.","例句中文":"嘟起嘴唇。","目標中文":"嘴唇","延伸單字":"윗입술 (上唇) / 아랫입술 (下唇) / 잇몸 (牙齦)","詳細解說":"嘟起嘴唇的姿勢是「입술 쭉（嘴唇啾）」。如果嘟得更明顯，就是「입술 쭈욱（嘴唇啾～）」。像EXO的都敬秀一樣紅潤豐滿的嘴唇是「앵두 입술（櫻桃般的嘴唇）」。「입술이 터지다」意指「唇部乾燥、裂開」。「입꼬리가 올라가다（嘴角上揚）」表示「微笑」的動作。常在電視字卡上出現的「광대승천（顴骨升天）」指的是「滿面笑容」的意思。"}

{"ID":"047-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"턱선","漢字源（Hanja）":"-線","詞性":"名","中文意義":"下顎線","韓文例句":"베일 것 같은 턱선.","例句中文":"像刀子一樣銳利的下顎線。","目標中文":"下顎線","延伸單字":"-","詳細解說":"偶像和演員們對於清晰的臉部輪廓非常講究。「날렵한 턱선（銳利的下巴線條）」或者「베일 것 같은 턱선（像被切割過般銳利的下巴線條）」都是日常保養的成果。「雙下巴」則是「이중턱（살）」或「턱살이 잡히다（抓得住下巴的肉）」。「주걱턱」是指「厚斗」。◎「선」指的是線條，「舞蹈線條」就是「춤선」。"}

{"ID":"048-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"손바닥","漢字源（Hanja）":"","詞性":"名","中文意義":"手掌","韓文例句":"스타들의 손바닥 핸드프린팅.","例句中文":"明星們手掌的手印。","目標中文":"手掌","延伸單字":"발바닥 (腳底) / 혓바닥 (舌頭的表面)","詳細解說":"「手掌」就是「손바닥」。「바닥」意指「平坦的部分、下面的部分」。看手相（손금）時說「請把手掌打開」就是「손바닥 펴 보세요」。形容「很狹窄」可以說「손바닥만 하다（只有手掌大小）」，例如「손바닥만 한 텃밭（很小的家庭菜園）」。被打要抱著很痛時，可以用「손이 맵다（辣手）」來表達。而「엄마손은 약손（母親的手是藥的手）」是指「痛痛飛走吧」的意思。"}
,
{"ID":"049-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"손등","漢字源（Hanja）":"","詞性":"名","中文意義":"手背","韓文例句":"손등에 키스.","例句中文":"親吻了手背。","目標中文":"手背","延伸單字":"등딱지 (螃蟹或烏龜的甲殼)","詳細解說":"韓語中的手背、腳背都用到了「등（背）」這個字。腳背稱為「발등」，把手和腳當成一組記下來吧。「손등에 핸드크림을 발라요」就是在「手背上擦護手霜」。「등골」指的是「脊椎」。「등골브레이커（脊椎破壞者，指啃老族）」是一個新造語，指的是強迫父母買昂貴的東西給自己，讓他們被沉重負擔壓得脊椎彎曲的「불효（不孝）」行為。BTS的歌曲中也有以此為題的歌曲。"}
,
{"ID":"050-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"엄지","漢字源（Hanja）":"-指","詞性":"名","中文意義":"大拇指","韓文例句":"엄지척!","例句中文":"超讚！","目標中文":"超讚","延伸單字":"중지 가운뎃손가락 (中指) / 약지 약손가락 (無名指) / 엄지발가락 (腳的大拇指)","詳細解說":"豎起大拇指的姿勢稱為「엄지척」。「엄지를 치켜세우게 만드는 맛집.」就是「能讓人豎起大拇指的美食店」。這個姿勢以前被稱為「따봉」。雙手豎起大拇指是「쌍따봉」。將엄지和검지 집게손가락 (食指) 交叉成愛心形狀的「손가락 하트 (手指愛心)」，據說也起源於韓國。順便一提，大拇指也被稱為「엄지손가락」。「지」和「손가락」分別是漢字詞和固有語的「手指」，所以是一種重複表現。"}
,
{"ID":"051-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"새끼손가락","漢字源（Hanja）":"","詞性":"名","中文意義":"手的小指","韓文例句":"새끼손가락 걸고 맹세.","例句中文":"打勾勾許下約定。","目標中文":"打勾勾","延伸單字":"새끼발가락 (腳的小指) / 손톱 (指甲) / 손톱깎이 (剪指甲)","詳細解說":"講到小指時，比起漢字詞的「小指」，更常使用固有語的「새끼손가락」。「(用小指) 打勾勾許下約定」，則是「새끼손가락 걸고 맹세」或「새끼손가락 걸고 약속」。關於手指的諺語還有「열 손가락 깨물어 안 아픈 손가락 없다 (咬了十根指頭，沒有一根指頭不會痛＝所有孩子都很重要)」。「손가락질」就是「指」的動作。「손가락질을 받다」就是「遭人指指點點」的意思。"}
,
{"ID":"052-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"어깨","漢字源（Hanja）":"","詞性":"名","中文意義":"肩膀","韓文例句":"어깨를 주물러 드릴까요?","例句中文":"要幫你按摩一下肩膀嗎？","目標中文":"肩膀","延伸單字":"《俗》상남자 (上男子：男子漢) / 가슴팍 (胸膛) / 초콜릿 복근 (chocolate腹筋：明顯的六塊肌)","詳細解說":"肩膀的寬度和厚度是男子氣概的象徵。像BTS的金碩珍、姜丹尼爾和宋江的「寬肩膀」被用俗語稱為「어깨 깡패 (肩膀流氓)」。演員金宇彬、徐仁國、池昌旭、蘇志燮等人也是娛樂圈代表性的어깨 깡패。「형 어깨 넓은 거 다 알아요.」(我知道哥的肩膀很寬)。開心地搖動肩膀跳舞被稱為어깨춤 (肩膀舞)。"}

{"ID":"053-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"다리","漢字源（Hanja）":"","詞性":"名","中文意義":"腿","韓文例句":"정국이 다리 길이 실화냐?","例句中文":"柾國那腿長，真的假的？","目標中文":"腿","延伸單字":"허벅지 (大腿) / 무릎 (膝蓋) / 종아리 (小腿) / 팔다리 (四肢)","詳細解說":"韓語中「腿細」是用「腿薄」來表示，說成「다리가 얇다」。「腿受傷」則是「다리 부상 (腿負傷)」。動物的腿一樣稱為「다리」，前腿是「앞다리」，後腿是「뒷다리」。炸雞中最受歡迎的部位是「닭다리」(雞腿)。從「발목」(腳踝) 開始往前的部分稱為「발」(腳)，往後的部分稱為「다리」(腿)。「맨발」是「赤腳」，如「맨발로 춤을 추다 (赤腳跳舞)」。「발끝」是腳尖，所以指尖就是「손끝」；「발뒤꿈치」是腳後跟，所以手肘就是「팔꿈치」。"}
,
{"ID":"054-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"덩어리","漢字源（Hanja）":"","詞性":"名","中文意義":"塊，團","韓文例句":"사랑스러운 매력 덩어리들.","例句中文":"可愛又有魅力的 (一團) 孩子們。","目標中文":"(一團)","延伸單字":"응어리 (心裡的疙瘩)","詳細解說":"在娛樂圈中經常使用的是「매력 덩어리」(魅力的塊，指充滿魅力的人)。「의혹 잇따른 비리 덩어리」(疑慮接踵而至、不正之塊) 則是「정치인」(政治人：政治家) 常說的話。「핏덩어리」(血塊) 指的是「剛出生的嬰兒」，即「신생아」(新生兒)。「핏덩어리 바꿔치기」(替換新生兒) 是韓劇中常見的情節。「골칫덩어리」(讓人頭痛的塊) 則指的是「麻煩人物」，如「집안 골칫덩어리」(一家之中的麻煩人物)。"}

{"ID":"058-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"잘생기다","漢字源（Hanja）":"","詞性":"動","中文意義":"長得好看","韓文例句":"우리 오빠들 너무 잘생기지 않았어요?","例句中文":"我家的歐巴們也太帥了吧？","目標中文":"太帥","延伸單字":"얼짱 (Ulzzang，臉讚) / 존잘남 (超級帥哥)","詳細解說":"要形容「長得好看」時，對男性使用「잘생기다 (帥氣)」，對女性則使用「예쁘다 (漂亮)」。「很帥」用的是現在式的「잘생겨요」，而是過去式的「잘생겼어요」。「帥哥、美男子」可用「꽃미남 (花美男)」或「훈남 (薰男、暖男，定義較廣泛的帥哥)」。「像漫畫般的帥哥」則可以說「만찢남」，是「만화를 찢고 나온 남자 (從漫畫中走出來的帥哥)」的略稱。"}

{"ID":"059-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"못생기다","漢字源（Hanja）":"","詞性":"動","中文意義":"長得醜","韓文例句":"나 예뻐? 아니, 못생겼어!","例句中文":"我可愛嗎？不，你醜死了！","目標中文":"醜","延伸單字":"-","詳細解說":"「못생기다 (外表醜陋)」是一個激烈的用詞，但在「친한 사이」(關係親密的友人) 之間很常使用。有許多網路漫畫改編的電視劇，如《我的ID是江南美人》、《女神降臨》等是以외모 (外貌：容姿) 焦慮為主題，敲響了對「외모지상주의」(外貌至上主義：lookism) 的警鐘。比起外表好看但「미운 짓 (行為醜陋)」的人，大家更喜歡「호감형 (令人有好感的類型)」。"}

{"ID":"060-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"귀엽다","漢字源（Hanja）":"","詞性":"形","中文意義":"可愛","韓文例句":"우리 막내 귀여워 죽겠어.","例句中文":"我們家的忙內實在太可愛了。","目標中文":"可愛","延伸單字":"사랑스럽다 (討人喜歡)","詳細解說":"我們傾向用「可愛」形容各種事物，但這個詞本來的意思是指「憐愛微小脆弱的事物、孩子或動物的心」。當使用「귀엽다」這個詞時，也應該意識到這層意思。還有其他表示「可愛」的詞彙。像「깜찍하다」用於描述「小而可愛的東西」，例如「깜찍한 아기」(可愛的嬰兒)。「아기자기하다」則用來表示「細緻而可愛的事物」，例如「아기자기하게 꾸민 방」(裝飾得很可愛的房間)。"}

{"ID":"061-1","章節（PART）":"PART 1 比較一下跟「人」有關的單字吧","單字（韓文）":"예쁘다","漢字源（Hanja）":"","詞性":"形","中文意義":"漂亮","韓文例句":"언니 너무 예뻐요.","例句中文":"姊姊太漂亮了。","目標中文":"漂亮","延伸單字":"예쁘장하다 (漂亮) / 곱다 (漂亮，美麗)","詳細解說":"日文單字「綺麗 (kirei)」有外表華美 (예쁘다)、整齊、整潔 (깔끔하다)、乾淨 (깨끗하다) 等多種意思，但在韓語中，則各有不同的詞彙表達。廣義的「可愛」在韓語中是用 예쁘다 表達。對於年長的偶像，用「예쁘다 (漂亮)」比「귀엽다 (可愛)」更合適。這同時也有「精緻」的意思，因此可用於描述男性的時尚。「예쁘다」還有「聽話可愛」的意思。"}

{"ID":"067-1","章節（PART）":"PART 2 比較一下社群媒體和電視節目常用的單字吧","單字（韓文）":"비번","漢字源（Hanja）":"秘番","詞性":"名","中文意義":"密碼 (「秘密番號」的略稱)","韓文例句":"비번이 틀렸대요.","例句中文":"密碼好像錯了。","目標中文":"密碼","延伸單字":"-","詳細解說":"不僅用於登入手機或電腦，因為在韓國很多人家裡都使用數字鎖，所以連打開門也需要輸入비밀번호 (秘密番號)。大多數人略稱為「비번」。例如「비번을 누루다 (按下密碼)」、「홧김 에 현관문 비번 바꿔 버렸어요 (一怒之下把大門密碼換掉了)」。 「鎖」是「자물쇠」，「鑰匙」是「열쇠」。車子或家裡的鑰匙也可以說成「키 (key)」，如「차 키」(車鑰匙)、「집 키」(家裡鑰匙)。"}

{"ID":"068-1","章節（PART）":"PART 2 比較一下社群媒體和電視節目常用的單字吧","單字（韓文）":"짤","漢字源（Hanja）":"《俗》","詞性":"名","中文意義":"圖片 (主要來自網路)","韓文例句":"연예인 짤 모음.","例句中文":"藝人的圖片合輯。","目標中文":"圖片","延伸單字":"남친짤 (男友風照片) / 여친짤 (女友風照片)","詳細解說":"在發文需要附圖的社群網站上，為了避免被管理者刪文，人們會上傳「잘림 방지용 이미지 (防刪圖)」，這些圖片便被略稱為「짤방」或「짤」。「짤」這個詞源自於口語中「잘리다」發音為「짤리다」的習慣。GIF動畫 (움직이는 짤：動圖) 則被略稱為「움짤」，代表著動態圖像。製「짤」達人會在社群媒體上發布流傳圖片，存圖收集的行為 (줍는 행위) 被稱為「줍줍」。有時人們也會用英文的「밈」(meme) 來代替「짤」。"}

{"ID":"078-1","章節（PART）":"PART 2 比較一下社群媒體和電視節目常用的單字吧","單字（韓文）":"깔다","漢字源（Hanja）":"","詞性":"動","中文意義":"鋪，放進","韓文例句":"어플을 새로 깔다.","例句中文":"安裝了新的應用程式。","目標中文":"安裝","延伸單字":"다시 깔다 (重新安裝)","詳細解說":"「安裝」應用程式、APP等到智慧手機或電腦上可以用「설치하다 (設置)」或是「깔다」。而「뜨다」則指影片 (동영상) 或公告 (공지) 等「被公開」的情況，以及在智慧手機或電腦螢幕上「出現」的事物。比如說，「콘서트 공지가 뜨다 (演唱會公告發布了)」、「이상한 광고가 뜨다 (出現了奇怪的廣告)」。Twitter等社群媒體的「실시간 트렌드」(即時趨勢) 略稱為「실트」，而「실트 에 뜨다」則是指「登上即時趨勢」的意思。"}

{"ID":"080-1","章節（PART）":"PART 2 比較一下社群媒體和電視節目常用的單字吧","單字（韓文）":"첫방","漢字源（Hanja）":"-放","詞性":"名","中文意義":"(節目) 首播","韓文例句":"오늘 첫방 놓치지 마시고 꼭 보세요.","例句中文":"請不要錯過今天的首播。","目標中文":"首播","延伸單字":"첫눈 (初雪) 첫사랑 (初戀) / 첫차 (首班電車・公車) / 첫 마디 (第一句話，第一聲) / 첫 곡 (第一首歌，第一曲)","詳細解說":"「첫방 (首播)」是「첫 방송 (初回放送)」的略稱。「본방」則是相對於「재방송 (再放送)」的「本放送」的略稱。目前風靡全球的串流影音觀賞服務也已在韓國推出，名為「다시보기」，不是「다시보기」或「재방송」，而是同步的「即時觀看」被稱為「본방사수 (本放死守)」。「본방사수 하실 거죠?」(你會本放死守嗎？)「事前錄製」是「사녹」，略稱自「사전녹화 (事前錄畫)」。「劇透」則是「스포」，略稱自「스포일러 (spoiler)」。"}

{"ID":"081-1","章節（PART）":"PART 2 比較一下社群媒體和電視節目常用的單字吧","單字（韓文）":"막콘","漢字源（Hanja）":"-con 《俗》","詞性":"名","中文意義":"演唱會終場","韓文例句":"막콘 파이팅!","例句中文":"終場了，加油！","目標中文":"終場","延伸單字":"첫콘 (演唱會首場) / 마지막 회 (最終回) / 열린 결말 (開放式結局)","詳細解說":"「콘서트 마지막 날」是「演唱會的最後一天」。「막-」就是「막내 (老么)」的「막」，是表示「마지막 (最後)」的前綴。「末班車」是「막차 (-車)」。「막차 끊겼다고요?」(末班車開走了嗎？)「막바지」和「막판」都是指「結束，最後階段」，「마감」則表示「截止，關店」，例如「저희 식당 9시 마감이에요.」(我們餐廳是九點關門。)。「마무리」是「完成、結束」，例如「그럼 마무리를 하도록 합시다.」(那就收工吧。)"}

{"ID":"082-1","章節（PART）":"PART 2 比較一下社群媒體和電視節目常用的單字吧","單字（韓文）":"먹방","漢字源（Hanja）":"","詞性":"名","中文意義":"吃播","韓文例句":"배 고프니까 먹방 해볼까요?","例句中文":"肚子正好餓了，來嘗試一下吃播吧？","目標中文":"吃播","延伸單字":"쿡방 (cook 放：煮播，烹飪影片) / 잠방 (- 放：睡播，播放睡覺樣子的影片，或睡覺時看的影片)","詳細解說":"這是「먹는 방송」(吃+放送) 的略稱，指的是內容只有吃東西的影片。這類讓觀眾聽到咀嚼或吞嚥食物聲音、刺激大腦產生愉悅感的影片，屬於一種ASMR (自發性知覺神經反應) 影片。它迅速風靡世界，尤其受到正在實踐「다이어트 (節食)」或「자취생 (自炊生：一人生活)」的人們喜愛。另外還有略自「눕는 방송 (躺著放送)」的「눕방 (躺播)」這類影片通常是在床上等舒適的位置，以放鬆的姿態拍攝。"}

{"ID":"083-1","章節（PART）":"PART 2 比較一下社群媒體和電視節目常用的單字吧","單字（韓文）":"생방","漢字源（Hanja）":"生放","詞性":"名","中文意義":"現場直播","韓文例句":"지금 생방 중이에요.","例句中文":"現正直播中。","目標中文":"直播","延伸單字":"-","詳細解說":"「생방송 (生放送)」的略稱。韓國的電視劇常被揶揄為「생방 (生放)」。這是因為製作過程與實際播出同步進行，雖然能反映觀眾的聲音，但拍攝因此無法趕上播出進度，導致演員和工作人員必須通宵工作，或臨時撰寫「쪽대본 (當日劇本)」，需要即興演出的情況也屢見不鮮。這樣的嚴苛環境，或許也孕育出了高水準的演員和工作人員。近年來，「사전제작 (事前製作)」的劇集增加，也進行了法律規範，拍攝環境似乎有了相當的改善。"}

{"ID":"089-1","章節（PART）":"PART 2 比較一下社群媒體和電視節目常用的單字吧","單字（韓文）":"땡","漢字源（Hanja）":"","詞性":"名","中文意義":"叮","韓文例句":"아쉽게도 땡.","例句中文":"太可惜了，叮。","目標中文":"叮","延伸單字":"-","詳細解說":"「땡 (叮)」則是「오답 (答錯)」時候的效果音。有時也用來形容鐘聲。因為「학교종 (學校的鐘聲)」是땡땡땡 (叮叮叮) 地響。「12시 땡 치면~ (變成12點的鐘就~)」就是「剛好12點的時候就~」的意思。花牌的「役」或是玩「冰鬼遊戲」(譯注：類似紅綠燈的遊戲) 要逃離鬼時要說的「冰」也是用「땡」。日本關西地區玩「鬼抓人」要救人時喊的「叮 (den)」音效與其相似。"}

{"ID":"090-1","章節（PART）":"PART 2 比較一下社群媒體和電視節目常用的單字吧","單字（韓文）":"후렴","漢字源（Hanja）":"後斂","詞性":"名","中文意義":"副歌","韓文例句":"귀에 팍팍 꽂히는 후렴구 멜로디.","例句中文":"縈繞在耳邊的副歌旋律。","目標中文":"副歌","延伸單字":"가사 노랫말 (歌詞)","詳細解說":"「副歌」為音樂用語。副歌在字幕上會被更正為「후렴（後斂）」或「후렴구（後斂句）」，但在偶像的對話中有時仍會說出「싸비（ssabi）」（來自日語sabi）。這源自日語的詞彙隨時代演變已被韓語取代，但仍有一些詞彙保留著，比如「찌라시（jjirasi：傳單）」（日：chirashi）、「시마이（simai：結束）」（日：shimai）、「노가다（nogada：土方）」（日：dokata）、「가오（gao：面子）」（日：kao）、「다시（dasi：湯汁）」（日：dashi）等。「令人中毒的歌詞」則稱為「킬링파트（killing part）」，為韓製英語。"}

{"ID":"091-1","章節（PART）":"PART 2 比較一下社群媒體和電視節目常用的單字吧","單字（韓文）":"안무","漢字源（Hanja）":"按舞","詞性":"名","中文意義":"編舞","韓文例句":"이번 곡 포인트 안무는 수어예요.","例句中文":"這首歌的編舞重點在手語。","目標中文":"編舞","延伸單字":"댄스 트레이너 (舞蹈教練)","詳細解說":"「안무（按舞）」是指舞蹈的「編舞」。其中，容易留下印象且令人中毒的舞蹈部分被稱為포인트 안무（point按舞：亮點編舞）。「精通編舞」被稱為「안무를 따다」。「따다」也有「取得」獎牌或執照等的意思。在K-POP的「커버댄스（cover dance：翻跳）」蔚為流行的情況下，「안무가（按舞家：編舞師）」也一併受到關注。"}

{"ID":"092-1","章節（PART）":"PART 2 比較一下社群媒體和電視節目常用的單字吧","單字（韓文）":"칼군무","漢字源（Hanja）":"-群舞","詞性":"名","中文意義":"《俗》刀群舞","韓文例句":"소름 돋는 칼군무.","例句中文":"令人起雞皮疙瘩的刀群舞。","目標中文":"刀群舞","延伸單字":"《俗》칼답 (秒回) / 《俗》칼삭 (秒刪)","詳細解說":"「칼」泛指涵蓋「美工刀」、「菜刀」到「小刀」的「刀刃」。為了做出區別，「菜刀」也稱為「부엌칼（廚房的刀）」。從刀刃銳利的印象，被延伸作為新造語的前綴。「칼군무（-群舞：刀群舞）」指的就是「像刀子劃過般整齊劃一的團體舞蹈」。飛快的行動也可以用「칼같이~（像刀子一樣~）」來表現。"}

{"ID":"093-1","章節（PART）":"PART 2 比較一下社群媒體和電視節目常用的單字吧","單字（韓文）":"칼퇴근","漢字源（Hanja）":"-退勤","詞性":"名","中文意義":"《俗》準時下班","韓文例句":"야근 너무 싫어요. 칼퇴근 하고 싶어요.","例句中文":"我討厭加班。我想準時下班。","目標中文":"準時下班","延伸單字":"-","詳細解說":"「칼퇴근（-退勤）」是「時間一到就迅速下班」的意思，有時也略稱為「칼퇴」。「上班」是「출근（出勤）」，「下班」是「퇴근（退勤）」。偶爾結束工作之後也會「퇴근」。「퇴사（退社）」則多用於「辭去工作」的意思。「퇴근하고 싶어」（好想下班=好想回家）、「퇴사하고 싶어」（好想退社=想離開事務所），兩者意思是不一樣的，還請注意。▶「야근（夜勤）」是加班的意思。「야간 근무（夜間勤務）」是值夜班的意思。"}

{"ID":"094-1","章節（PART）":"PART 2 比較一下社群媒體和電視節目常用的單字吧","單字（韓文）":"도장","漢字源（Hanja）":"圖章","詞性":"名","中文意義":"印章","韓文例句":"재계약 계약서에 도 장 찍었어요.","例句中文":"在續約的合約書上蓋下了印章。","目標中文":"印章","延伸單字":"-","詳細解說":"「도장（圖章：印章）」是日韓共通的文化。「正式印章」稱為「인감도장（印鑑圖章）」，韓國也有印鑑登錄制度。「蓋印章」是「도장을 찍다」。韓國人打勾勾時不但要勾小指，還要用大拇指互相蓋印章，稱為「손가락 걸고 도장」。按指紋的手勢則稱為「손도장」。「얼굴도장」的意思是「用臉蓋印章」，指的是「走來走去跟人打招呼」或是在會議上「露臉」，好讓別人記住自己的臉。"}

{"ID":"098-1","章節（PART）":"PART 2 比較一下社群媒體和電視節目常用的單字吧","單字（韓文）":"캐스팅","漢字源（Hanja）":"casting","詞性":"名","中文意義":"發掘","韓文例句":"길거리를 걷다가 캐스팅되다.","例句中文":"走在路上的時候被星探發掘。","目標中文":"發掘","延伸單字":"매니저 (經紀人)","詳細解說":"「캐스팅」的原意是為「드라마（電視劇）」或「영화（電影）」、「뮤지컬（音樂劇）」等選角，但也有「發掘」的意思。也被說成「길거리 캐스팅（街頭選角）」。「아이돌 지망생（偶像志願生）」藉由發掘或「오디션（Audition：甄選）」成為「연습생（練習生）」之後，就會開始接受特訓。不過，最後可能只有1%的人可以「데뷔（出道）」。一旦成功出道，就會與「엔터 기획사（經紀公司）」簽約。由於藝人的奴隸契約成為社會問題，專屬契約期限被設定為最長7年，因此第7年（7년차）往往就是「재계약（續約）」的時候。如果無法取得共識，該團體基本上會被解散。在過去，韓國在休止期和活躍期的曝光度會有差異，因此發布新歌時就稱為「컴백（回歸）」。現在除了「음악프로（音樂節目）」之外，還有「예능프로（綜藝節目）」、影片直播、社群媒體等活動，就像沒有休止期一樣。如果是出現在電視劇，則被稱為「안방 극장 컴백（家庭劇場回歸）」。"}

{"ID":"104-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"추리닝","漢字源（Hanja）":"training","詞性":"名","中文意義":"運動服","韓文例句":"추리닝 입고 왔니?","例句中文":"你穿運動服來嗎？","目標中文":"運動服","延伸單字":"추리닝 바지 트레이닝 바지 (運動服的褲子) / 체육복 (體育服) / 긴팔 티 롱티 (長袖T恤)","詳細解說":"在韓劇《魷魚遊戲》中蔚為話題的「運動服」稱為「추리닝」或「트레이닝복（訓練服）」。有時也會寫成「츄리닝」。「맨투맨（man-to-man）」是指「大學T」，源自品牌名稱。有連帽的「帽T」則是「후드티（Hoodie）」。前面有拉鍊的「집업（zip-up：拉鍊連帽外套）」發音為「jib-eob」，「셋업（set-up：套裝）」則發音為「set-eob」。在朝鮮日治時期引進西式服裝後，韓國與服裝相關的詞彙中有許多是源自日語。「마이」意指西裝外套或制服外套，其語源被認為來自日語指胸前有垂直單排扣的「片前」。「正裝襯衫」在日本會略稱為「Y-shirt」，在韓國也稱為「와이셔츠（waisyeocheu）」。襯衫有時也會寫作「샤쓰」，這也是來自日語的簡化。無袖的衣服稱為「나시」，有扣的休閒襯衫則稱為「남방（南方）」。"}

{"ID":"106-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"빨다","漢字源（Hanja）":"","詞性":"動","中文意義":"清洗","韓文例句":"양말을 빨다.","例句中文":"洗襪子。","目標中文":"洗","延伸單字":"-","詳細解說":"這裡介紹和洗衣服相關的動詞。洗衣服的「洗」是「빨다」。「待洗衣物」則稱為「빨래」或「빨랫감」。「手洗」稱為「손빨래」，「預先沖洗」稱為「애벌빨래」，「用洗衣機洗」則是「세탁기를 돌리다」。將白色衣物放入湯鍋中進行「빨래 삶기（煮洗）」的家庭也很常見。「晾乾」可以使用「말리다」，但若是「攤開晾乾」則使用「널다」。被問「이 많은 빨래 어디서 널지?（洗那麼多衣服，要晾在哪裡？）」的時候，可以使用「빨래 건조대（曬衣架）」或用「빨래집게（曬衣夾）」固定在洗衣繩上。將衣服收進來是「걷다」，這有「把四散的東西集合起來」的意思，是「거두다」的縮語。「비 올 것 같으니까 얼른 빨래 걷어 줘.（快下雨了，趕快把衣服收進來。）」。「이불을 개다（摺被子）」也會用到「摺疊」的「개다」。「얼른 일어나서 이불 개고 밥 먹어.」（快起床把被子摺一摺吃早餐。）"}

{"ID":"114-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"감다","漢字源（Hanja）":"","詞性":"動","中文意義":"洗（頭髮）","韓文例句":"머리를 감다.","例句中文":"洗頭髮。","目標中文":"洗","延伸單字":"-","詳細解說":"洗頭髮的「洗」是用「감다」而不是「씻다」。「감다」指的是在水流等地方「沐浴、浸泡於水中」。並非「洗東西」的行為，則只能用「씻다」來表示。例如「빨리 씻고 잘래（快點洗完澡去睡覺）」。韓國家庭主要是採用淋浴，有很多人家裡沒有浴缸，或不使用浴缸的。朝鮮日治時期，隨著日本的澡堂文化傳入，「목욕탕（沐浴場：大眾浴場）」開始普及，設施完善的「찜질방（-房：桑拿房）」則在90年代出現。「吹乾」頭髮用「말리다」。「吹風機」叫做「드라이기」或「헤어드라이어」，「電棒」則叫做「고데기」。「梳」頭髮叫做「빗다」。「빗」是指梳子，因此「用梳子梳頭髮」就是「빗으로 빗다」。將頭髮「捲起」是「말다」。「把頭髮弄得捲捲的」就是「돌돌 말다」。事實上，「감다」也有「捲」的意思。例如包紮時的「纏繞」就用「감다」，像「김밥（壽司捲）」一樣「捲成一捲」則是「말다」。"}

{"ID":"116-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"밥","漢字源（Hanja）":"","詞性":"名","中文意義":"飯","韓文例句":"여러분 밥은 맛있게 드셨어요?","例句中文":"各位用餐還愉快嗎？","目標中文":"餐","延伸單字":"콩밥 (豆飯=牢飯) / 짬밥 (剩飯=部隊的伙食、經歷)","詳細解說":"「밥」是對話的潤滑劑。打電話時的問候常以「밥 먹었니?（吃過飯了嗎？）」開頭，用來代替「喂喂，你還好嗎？」如果是早上，則會問아침 먹었어?（吃過早飯了嗎？），如果是中午則是점심 먹었어?（吃過午飯了嗎？） 。「우리 언제 밥 먹자.（下次約個吃飯吧）」，則是韓國人在道別時、掛電話時的問候語。「밥」也用作隱語。「떡밥（釣餌）」指的是「提示、伏筆，用以吸引粉絲的情節散播」。「밥맛 떨어진다」表示「失去食慾=飯菜不好吃」。「煮飯」是「밥을 짓다（炊飯）」，「煮粥」則是「죽을 끓이다（煮粥）」。粥的「濃稠感」稱為「걸쭉하다」。沒加東西的粥稱為「흰죽（白粥）」。加入「전복（鮑魚）」或「잣（松子）」的粥則常用來當作滋補品。有許多慣用語會用到「죽」，例如「죽이 되든 밥이 되든~（不管變成粥還是變成飯）」意味著「不論結果如何~」，「죽도 밥도 안 되다（無法變成粥也無法變成飯）」則是指「高不成，低不就」。"}
,

{"ID":"118-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"양념","漢字源（Hanja）":"","詞性":"名","中文意義":"調味醬*","韓文例句":"후라이드 반 양념 반.","例句中文":"炸雞要一半原味、一半洋釀。","目標中文":"洋釀","延伸單字":"양념갈비 (醬醃排骨) / 생갈비 (生排骨) / 양념게장 (辣味醬蟹) / 간장게장 (醬蟹)","詳細解說":"「양념（調味醬）」一詞源於「약념（藥念）」，指的是混合各種調味料和香料的醬汁。提到韓式炸雞，就會想到辣風味的「양념치킨（洋釀炸雞）」。這種用「辣椒醬（고추장）」、「醬油（간장）」、「糖（설탕）」及「大蒜（마늘）」等混合調製的醬汁包裹而成的「양념치킨」，自從80年代在韓國出現以來，一直作為觀賞足球賽時的搭配以及國民宵夜而深受喜愛。不加醬汁的原味炸雞則稱為「후라이드（Fried）」。「국」指的是湯品，「국물」則是指「湯汁」。韓國料理以湯品種類眾多為著稱，如「미역국（海帶湯）」、「순두부찌개（嫩豆腐鍋）」、「갈비탕（排骨湯）」和「설렁탕（牛骨湯）」等。據說有很多人一旦少了熱呼呼的「국물」就吃不下飯。「국물도 없다（無湯可言）」便有「毫不留情，沒血沒淚」的意思，這正是飲食文化的體現。"}

{"ID":"120-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"민초","漢字源（Hanja）":"","詞性":"名","中文意義":"薄荷巧克力","韓文例句":"난 비민초파야.","例句中文":"我是「反薄巧派」。","目標中文":"薄巧","延伸單字":"-","詳細解說":"「민트초코（mint choco）」的略稱。原本「민초（民草）」一詞是比喻「像雜草一樣堅強的民眾」。有人覺得薄荷巧克力有牙膏味（치약 맛），甚至還分為「호불호（好惡）」兩派。2018年大流行時，「喜歡薄荷巧克力」的藝人們被稱為「민초파（薄巧派）」，或「민초단（薄巧團）」。各種點心都推出了薄荷巧克力口味，甚至還誕生了薄荷巧克力口味的燒酒。韓國代表性的甜點，一整年都會吃。過去是以「팥（紅豆）」為主，佐以玉米片或果凍等配料，所以稱為「팥빙수」。現在則根據配料不同而稱為「과일빙수（水果冰）」、「딸기빙수（草莓冰）」、「초코빙수（巧克力冰）」等等。事實上，放有「팥（紅豆）」、「빙수떡（刨冰用麻糬）」、「인 절미（黃豆粉年糕）」等配料的冰品也被稱為「옛날 팥빙수（傳統紅豆冰）」。與日本的刨冰不同，這種冰品份量大，常與他人一同分享食用。"}

{"ID":"122-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"느끼하다","漢字源（Hanja）":"","詞性":"形","中文意義":"油膩，濃厚","韓文例句":"이 치즈 피자 너무 느끼해요.","例句中文":"這個起司披薩太過油膩了。","目標中文":"油膩","延伸單字":"기름지다 (肥膩)","詳細解說":"偏「기름기（油膩）」的料理被稱為「느끼한 음식（油膩食物）」。像是加了很多起司的「크림 파스타（奶油義大利麵）」或者日本的「라멘（拉麵）」等都是代表。「느끼하다」不僅指「食物有油膩感」，還包括「外觀和舉止過於招搖」的意思。例如「쌍꺼풀이 있는 얼굴은 좀 느끼해 요.」（雙眼皮的臉有點過於招搖）、「느끼한 멘트（刺耳的評論）」。「닭가슴살（雞胸肉）」和「칼국수（刀削麵）」等「清淡的食物」被稱為「담백한 음식」。「솔직담백하다（率直淡泊-）」指的是「直率且毫不虛偽」的態度，「坦率的感想」有時也稱為「솔직담백 후기（率直淡泊後記）」。「느끼하다」和「담백하다」這兩個詞也用於描述外表。「느끼한 얼굴」表示「濃顏」（五官深邃精緻），「담백한 얼굴」則表示「淡顏」（五官清秀淡雅）。"}

{"ID":"132-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"여의도","漢字源（Hanja）":"汝矣島","詞性":"名","中文意義":"韓國的政治中樞","韓文例句":"지난 총선을 통해 여의도에입 성한 김의원.","例句中文":"在上次大選中首次登上汝矣島（＝入閣）的金議員。","目標中文":"汝矣島","延伸單字":"-","詳細解說":"汝矣島是韓國國會議事堂（國會의사당）的所在地，因此也被視為韓國政治的代名詞。相當於日本的「永田町」（譯注：日本國家政治的中樞地區）。「여의도 입성」相對於「입각（入閣）」（顛覆汝矣島的邏輯）。過去此處廣播公司密集，但現在除了KBS（韓國廣播公司）外，多數已搬遷。這裡也是韓國的金融街，是金融監督院所在地，擁有全世界最多信徒的新教純福音教會也設立於此。順帶一提，「청와대（青瓦台：總統府）」則位於景福宮的北側。"}

{"ID":"133-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"충무로","漢字源（Hanja）":"忠武路","詞性":"名","中文意義":"韓國的好萊塢","韓文例句":"충무로 차세대 기대주.","例句中文":"忠武路的新生代潛力股。","目標中文":"忠武路","延伸單字":"-","詳細解說":"首爾市的地名。過去是電影院和相關電影公司的聚集地，因此至今仍被韓國電影界用作隱語。「來自汝矣島的呼喚」若是政界的邀請，「來自忠武路的呼喚」指的就是電影演出的邀約。「충무로 흥행보증수표（忠武路的票房保證）」。忠武的由來是出自於在這附近出生的忠武公李舜臣。解放前的原名為「本町」，曾是日本人的聚居地。"}

{"ID":"134-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"한반도","漢字源（Hanja）":"韓半島","詞性":"名","中文意義":"朝鮮半島","韓文例句":"한반도를 휘어잡은 슈퍼스타.","例句中文":"擄獲整個朝鮮半島的超級巨星。","目標中文":"朝鮮半島","延伸單字":"조선팔도 (朝鮮八道) / 팔도강산 (八道江山：韓國大地的江河山川)","詳細解說":"朝鮮半島指的是鴨綠江（압록강）和豆滿江（두만강）以南的地區。北端位於咸鏡北道溫城郡，南端位於全羅南道海南郡。若包括島嶼，最南端是位於濟州島南方的馬羅島（마라도）。總面積約為22萬平方公里，接近日本的本州。半島東側連綿山脈，許多河流自東向西流去。就像日本會以「列島」自稱一樣，朝鮮時代形成的行政區劃叫做「팔도（八道）」，也指「全國、全土」。"}

{"ID":"135-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"삼팔선","漢字源（Hanja）":"三八線","詞性":"名","中文意義":"38度線","韓文例句":"삼팔선 서로 넘지 말자고요.","例句中文":"我們不要再彼此越界（越過38度線）了。","目標中文":"38度線","延伸單字":"금을 긋다 (劃清界線)","詳細解說":"美蘇以北緯38度為界劃分占領區，而韓戰的停戰線也劃在38度左右。因此，「삼팔선」便逐漸成了南北韓的「國境線」。在日常生活中有時會用於表示不想越界，例如「선 넘어오지 마（不要越過38度線）」。也有人戲稱「삼팔선」是「38세까지 직장에서 버티면 선방」的縮寫，意思是「能在公司待到38歲，就算是打了漂亮的一仗」，用來諷刺無法保障工作到退休年齡的社會。"}

{"ID":"136-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"전하","漢字源（Hanja）":"殿下","詞性":"名","中文意義":"殿下","韓文例句":"성은이 망극하옵니다, 전하.","例句中文":"聖恩浩蕩，殿下。","目標中文":"殿下","延伸單字":"주상전하 (主上殿下：殿下) / 저하 (邸下：世子的敬稱)","詳細解說":"朝鮮君主的第二人稱是「전하（殿下）」。這指的是「臣下在御殿之下上奏」，相對於「從宮殿階梯下直上奏」的「폐하（陛下）」，是較低的敬稱。「폐하」被降格為「전하」，是從高麗時期被統治於元朝開始。「태자（太子）」和「태후（太后）」這些稱呼也被降格為「세자（世子）」和「대비（大妃）」。朝鮮王朝也效仿此制度，直到大韓帝國擺脫中華統治，才恢復了「황제 폐하（皇帝陛下）」的稱呼。"}

{"ID":"137-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"마마","漢字源（Hanja）":"媽媽","詞性":"名","中文意義":"王室成員尊稱","韓文例句":"아바마마 소자를 믿어 주시옵소서.","例句中文":"父王，還請您相信我。","目標中文":"父王","延伸單字":"-","詳細解說":"這是用於王室或王族的宮廷用語，不分性別。源自於中國，自被統治於元朝之後的高麗中期後就廣泛使用。王族稱王為「상감마마（上監媽媽）」。「상감（上監）」也是「王」的意思。幼小的世子（세자）會稱雙親為「아바마마（父王）」或「어마마마（母后）」，臣民則稱世子為「세자마마」。對官員使用的敬稱「마님（大人）」限定用於正三品以上，也就是穿著紅色衣服的官員，而「나리（나으리，大人）」則適用於從三品以下穿著藍色或綠色衣服的官員。「소자（小子）」是在父母面前使用的自稱詞。"}

{"ID":"139-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"양반","漢字源（Hanja）":"兩班","詞性":"名","中文意義":"那位，先生","韓文例句":"요새 젊은 양반들은...","例句中文":"最近的年輕人......","目標中文":"年輕人","延伸單字":"양반다리 (盤腿)","詳細解說":"高麗和朝鮮都有身分制度，其中一個支配階級是透過科舉考試來培養官僚的「양반（兩班）」。在朝鮮初期，自稱「양반」的人不到1%，但到末期，據說有百分之七十的人自稱「양반」。至今，中老年人有時仍會用兩班稱呼「自己的丈夫」或「同輩和年輕男性」來稱呼。如「의사 양반（醫生先生）」、「형사 양반（警察先生）」、「기자 양반（記者先生）」、「피디 양반（製片人先生）」等。「那邊的警察先生」就是「거기 형사 양반」。"}

{"ID":"140-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"일제시대","漢字源（Hanja）":"日帝時代","詞性":"名","中文意義":"日治時期","韓文例句":"일제 시대를 배경으로 한 영화.","例句中文":"以日治時期為背景的電影。","目標中文":"日治時期","延伸單字":"일어 (日語) / 일식 (日食：日本食物) / 일제 (日製：日本製造)","詳細解說":"1910年到1945年的朝鮮日治時期被稱為「일제시대（日帝時代）」或「일제강점기（日帝強占期）」。之所以稱為「強制占領」，是因為在韓國，從國際法角度來看，日本統治被解釋為是非法的。無論如何，韓國的建國精神是源於從日治時期之中「독립（獨立）」，這個事實無庸置疑。這件事在2020年代依然對韓國產生影響。當你更深入了解韓國，在日常生活的枝微末節中也會感受到以「일제시대」為近因或遠因的各種問題。"}

{"ID":"141-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"IMF 사태","漢字源（Hanja）":"-事態","詞性":"名","中文意義":"IMF通貨危機","韓文例句":"IMF 사태가 터져 취업이 힘들었어요.","例句中文":"由於IMF通貨危機，導致就業困難。","目標中文":"IMF通貨危機","延伸單字":"코로나 사태 (新冠疫情) / 세월호 참사 (世越號慘案)","詳細解說":"1997年的亞洲金融風暴影響深遠，使得國家經濟幾近破產邊緣。韓國當時接受國際貨幣基金組織（IMF）的經濟支援，展開了經濟重建，史稱「IMF 사태（IMF事態）」、「IMF 시대（IMF時代）」。在大量企業倒閉、重組的同時，韓國也開始專注於發展大眾文化產業，如電影等，並開啟由重工業轉向IT產業的產業變革。在社會上具有巨大影響的事件、事故，以及因此而起的社會混亂等，都稱為「사태（事態）」。"}

{"ID":"142-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"육이오","漢字源（Hanja）":"625","詞性":"名","中文意義":"韓戰","韓文例句":"6.25 때 헤어진 형을 만나는 것이 소원이였어.","例句中文":"我的願望是見到自己在韓戰期間失散的哥哥。","目標中文":"韓戰","延伸單字":"-","詳細解說":"近代史中的重要事件，有時會用日期來稱呼。「육이오」是指1950年6月25日爆發於南北韓之間的戰爭。在這場戰爭中，族群之間互相殘殺，許多家庭被迫分離。要在日常生活中誇大描述瑣碎的麻煩事時，就可以說「육이오 때 난리는 난리도 아니야（相較於戰爭時的動亂，這些根本不算什麼）」，這樣的說法以電視劇為契機廣為流傳。在《太極旗－生死兄弟》、《高地戰》、《搖擺男孩》等電影作品中皆有對韓戰的描繪。"}

{"ID":"143-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"오일팔","漢字源（Hanja）":"518","詞性":"名","中文意義":"光州民主化運動","韓文例句":"우리는 기억하리라, 5.18 그날의 참상과 아픔을.","例句中文":"我們永遠不會忘記光州民主運動那天的慘況和傷痛。","目標中文":"光州民主運動","延伸單字":"사일구 (四一九，4.19革命)","詳細解說":"「오일팔」是指1980年5月18日在「光州（광주）」發生的民主化示威事件。韓國軍隊封鎖了該市並鎮壓了示威活動，造成了許多人死亡。隨後的1987年6月10日，兩名大學生的死引發了「유월항쟁（6月抗爭：6月民主運動）」，並於6月29日導致了專制政權的崩潰和民主化的實現。每年5月都會舉行紀念活動。電影《我只是個計程車司機》描繪了光州事件，《1987：黎明到來的那一天》則描繪了6月民主運動。"}

{"ID":"144-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"입대","漢字源（Hanja）":"入隊","詞性":"名","中文意義":"入伍","韓文例句":"내년 초에 군 입대 하게 됐어요.","例句中文":"我明年的年初要入伍了。","目標中文":"入伍","延伸單字":"입영 (入營：入伍)","詳細解說":"對於偶像或演員來說，入伍問題是家常便飯。滿18歲以上的男性需接受兵役體檢，根據體檢結果服兵役。即使未判定為現役，也可能被指派為社會服務人員，發配到社會福利機構、公共團體、地方政府等單位值勤。由於藝人入伍後無法從事娛樂活動，因此兵役期間有時會稱為「군백기（軍白期：軍事和空白期的合成詞）」。在電視劇《太陽的後裔》中，主角劉時鎮（宋仲基飾）就是從軍校畢業的職業軍人。"}

{"ID":"145-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"제대","漢字源（Hanja）":"除隊","詞性":"名","中文意義":"退伍","韓文例句":"건강하게 제대했지 말입니다.","例句中文":"我平安退伍了。","目標中文":"退伍","延伸單字":"전역 (轉役：退伍)","詳細解說":"2021年韓國陸軍和海軍的服役期限為1年6個月。許多大學生會在大學期間入伍，退伍後返回學校，稱為「복학생（復學生）」。過去，逃避兵役和藝工隊等問題受到關注，渴望在娛樂圈維持活躍的人也增加。許多藝人在20多歲時入伍，等待他們服完兵役後的首次復出（군 제대 후 첫 컴백：軍隊退伍後的首次回歸）已成常態。服完兵役的人被稱為「군필（軍畢）」，如「군필 아이돌（已服完兵役的偶像）」。"}

{"ID":"146-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"사주","漢字源（Hanja）":"四柱","詞性":"名","中文意義":"八字命學","韓文例句":"사주 보러 갔다 왔어요.","例句中文":"我去算人算了八字。","目標中文":"八字","延伸單字":"점성술 (占星術)","詳細解說":"繁華街上招牌寫著「運命（운명）」和「哲學館（철학관）」的，就是「점집（占卜店）」。韓國的傳統占卜，分為儒家易學的「사주（四柱：八字命學）」，和透過占卜師傳達神諭的「신점（神占）」。在韓劇《愛上變身情人》、《黑道律師文森佐》等劇集中都出現過。其他如「관상（面相）」、「손금（手相）」、「육효（六爻）」、「타로（塔羅）」等不同形式的占卜也很興盛。"}

{"ID":"147-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"팔자","漢字源（Hanja）":"八字","詞性":"名","中文意義":"命運","韓文例句":"내 팔자가 어떻게 하다가 이렇게 꼬였지?","例句中文":"為什麼我的命運變得如此多舛？","目標中文":"命運","延伸單字":"-","詳細解說":"「求神問卦，其靈也不靈」的八卦指的是易學中的「天・澤・火・雷・風・水・山・地」八個元素。因此，팔자（八字）便被用來表示「命運，宿命」。「아이고 내 팔자야…」（唉唷，我的命好苦啊…）是電視劇中中年女性常說的句子。除了「운세（運勢）」外，單獨的「運」，也可用「운빨（運-）」來表示。受運氣左右的遊戲稱為「운빨게임（運氣遊戲）」。「-빨（발）」是表示力量或效果的後綴，常用於表示「~效果」。"}

{"ID":"148-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"굿","漢字源（Hanja）":"","詞性":"名","中文意義":"(薩滿的) 跳神儀式","韓文例句":"성공을 기원하는 굿.","例句中文":"祈求成功的跳神儀式。","目標中文":"跳神儀式","延伸單字":"-","詳細解說":"韓國的薩滿（祈禱師，靈媒師）被稱為「무당（巫堂）」或「무속인（巫俗人）」。像是電視劇《擁抱太陽的月亮》中的許煙雨（韓佳人飾）、《謗法》中的進境（趙敏修飾），以及電影《哭聲》中的日光（黃晸珉飾）都屬於這個範疇。薩滿穿著傳統服飾，搖鈴或站在刀上，進行稱為「굿」的宏大儀式，聆聽神明指示或除魔驅邪。"}

{"ID":"150-1","章節（PART）":"PART 3 比較一下表達食衣住行的單字吧","單字（韓文）":"인연","漢字源（Hanja）":"因緣","詞性":"名","中文意義":"緣分","韓文例句":"이번 생은 인연이 아닌가 봐요.","例句中文":"我們這輩子可能沒有緣分吧。","目標中文":"緣分","延伸單字":"-","詳細解說":"起源自佛教的「因緣」。在韓國，主要是指「緣分」，也包含了「命定之人」的意思。例如：「형하고는 남다른 인연이 있거든요.」（和哥有特別的緣分）、「좋은 인연을 만날 수 있게 해주세요.」（請讓我遇見好的緣分）。命定之人在韓語中稱為「천생연분（天生緣分）」。日語中的「因緣をつける（附加因緣＝挑起爭端）」在韓語中是「시비를 걸다（挑起是非）」。"}

{"ID":"154-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"진지하다","漢字源（Hanja）":"真摯-","詞性":"形","中文意義":"認真的","韓文例句":"저 진지하 거든요?","例句中文":"我是認真的喔？","目標中文":"認真的","延伸單字":"-","詳細解說":"「認真的」在韓語中稱為「진지하다」。例如「진지하게 고민해 봤어요（我認真地思考過了）」、「진지하게 해 주세요（請您認真地做）」。而「認真模式」稱為「진지 모드」。「진지」在敬語中還有「用餐」的意思。「嚴肅臉」在韓語稱為「정색（正色）」。「정색하다」則表示「變得嚴肅、變得正經」。比如，「왜 정색하고 그래요?」（為什麼您變得那麼嚴肅？）。而「認真的人」可以稱為「착실한 사람」或「성실한 사람」，「沉穩的人」則是「차분한 사람」。"}

{"ID":"155-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"장난","漢字源（Hanja）":"","詞性":"名","中文意義":"淘氣、惡作劇","韓文例句":"지금 장난해?","例句中文":"你在跟我開玩笑嗎？","目標中文":"開玩笑","延伸單字":"장난꾸러기 (調皮鬼) / 불장난 (玩火) / 장난 전화 (惡作劇電話) / 아재 개그 (老梗(大叔笑話)) / 농담 (弄談：玩笑話)","詳細解說":"和不認真的人有關的表達。「淘氣」在韓語中稱為「장난기（-氣）」。例如，「장난기가 많다（很淘氣）」、「장난기가 발동（起了惡作劇的心）」。「장난치다」或「장난하다」意指「開玩笑、戲弄」。玩食物或故意不分給人吃等與食物相關的「開玩笑」行為是違反禮儀的，所以曾被告誡「먹는 걸 가지고 장난치지 마（不要拿食物開玩笑）」。「장난이에요 장난.」表示「只是開玩笑=只是個玩笑」的意思。「놀리다」則是「取笑別人」。"}

{"ID":"166-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"다정하다","漢字源（Hanja）":"多情-","詞性":"形","中文意義":"溫柔","韓文例句":"막내를 다정하게 챙기는 맏이.","例句中文":"溫柔照顧忙內的大哥。","目標中文":"溫柔","延伸單字":"살갑다 (溫柔)","詳細解說":"用於形容情感的形容詞。我們說的「多情」指的是「바람기（花心、不忠）」，但韓語中的「다정（多情）」，則意味著「有人情味、心地溫暖、溫柔」。例如以說「형과는 다정한 사이（與兄弟關係親密=關係親近）」。表達「溫柔以待」可以用「다정하게 굴다或살갑게 굴다」。而「柔和、沒有稜角」這樣的「溫柔」則可以用「부드럽다」。比如「부드러운 눈빛（溫柔的眼神）」、「부드러운 성격（圓融的性格）」。"}

{"ID":"167-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"매정하다","漢字源（Hanja）":"","詞性":"形","中文意義":"冷淡","韓文例句":"매정하게 등을 돌린 막내.","例句中文":"對人不理不睬的忙內。","目標中文":"不理不睬","延伸單字":"인정사정없이 (人情事情-：不留情面)","詳細解說":"溫柔的反義詞「無情=冷淡，不理不睬」，可以用「매정하다」、「무정하다（無情）」、「몰인정하다（沒人情）」、「무심하다（無心-）」等詞彙表達。固有語則有「쌀쌀맞다」表達。「냉정하다」有「冷情=無情冷淡」和「冷靜=鎮定」兩種意思，因此需要注意上下文脈絡。「不近人情」可以用「인정머리（人情-）가 없다」或「인간미（人間味）가 없다」來表達。「嚴厲，苛刻」則可以說成「지독하다（至毒-）」、「모질다」。"}

{"ID":"168-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"붙임성이 좋다","漢字源（Hanja）":"","詞性":"","中文意義":"平易近人","韓文例句":"붙임성이 좋은 동생.","例句中文":"平易近人的後輩。","目標中文":"平易近人","延伸單字":"해맑다 (天真開朗)","詳細解說":"「붙임성」是「社交能力」的固有語。也可以簡單使用「잘（很擅長~）」簡單表達，例如「친구를 잘 사귀다（擅長交朋友）」、「사람과 잘 어울려 지내다（與人相處融洽）」。與人友好交往的能力稱為「친화력（親和力）」。性格外向的人，在網路用語中有時會被稱為「인싸」，在韓國則用會「인사이더（insider）」的縮寫「인싸」來表示。要進一步強調，就加上「핵（核）」來表示「超級」的意思，即「핵인싸」。"}

{"ID":"169-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"서먹서먹하다","漢字源（Hanja）":"","詞性":"形","中文意義":"疏遠，見外","韓文例句":"처음 만났을 때는 서먹서먹했던 동생.","例句中文":"初次見面時感覺很疏遠的後輩。","目標中文":"疏遠","延伸單字":"-","詳細解說":"疏遠見外的性格也可以說成「친화력이 없다（難以親近）」、「낯을 많이 가리다（非常怕生）」。「害羞的人」在韓文中可以表達為「부끄러움을 많이 타는 사람」、「수줍음이 많은 사람」、「숫기가 없는 사람」等多種形式。「부끄러움」和「수줍음」意指「害羞、羞澀」，而「숫기」則相反，指「活潑大方，不害羞」。「社恐」在韓文全是「아웃사이더（outsider）」的縮寫，稱為「아싸」。「拘束，尷尬」則可以說「어색하다」。"}

{"ID":"170-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"철들다","漢字源（Hanja）":"","詞性":"動","中文意義":"懂事，明理","韓文例句":"우리 막내 철들었네.","例句中文":"我們家的忙內也長大了啊。","目標中文":"長大了","延伸單字":"철 (季節，當季) / 봄철 (春季) / 제철 과일 (當季水果)","詳細解說":"「철」是指「能夠分辨事情，明白道理的能力」，是一個固有語。在俚語中也稱為「철딱서니」。而「철들다」表示「有分寸，精神年齡成熟」的意思。這個詞通常在青春期前後或服兵役前後使用。如果孩子不做功課光顧著打遊戲，就可以說「너 언제 철들래?」（你什麼時候才會長大？）、「철 좀 들어라.」（該長大一點了。）退伍後，則會說「군대 다녀오고 철들었네.」（從軍隊回來之後，你長大了。）"}

{"ID":"171-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"철없다","漢字源（Hanja）":"","詞性":"存","中文意義":"不懂事，不明事理","韓文例句":"철없는 형들.","例句中文":"不成熟的哥哥們。","目標中文":"不成熟","延伸單字":"유치하다 (幼稚) / 유치찬란 (幼稚燦爛：非常幼稚的意思)","詳細解說":"「철없다」指的是「沒有分寸、幼稚、不夠成熟、不懂世故」的意思。例如：「아직도 덕질하는 난 철이 없나 봐（還在追星的我，或許還不夠成熟吧）」。而「철부지（-不知）」指的是做出不成熟行為的人。「철부지 막내」是指像不成熟的老么一樣的長子或長女，其中「막내」是「맏이（老大）」和「막내（老么）」組合而成的新詞。「按年齡來說的懂事程度」則稱為「나잇값（年齡值）」，例如「나잇값 못 하는 행동（不成熟的行為）」。"}

{"ID":"172-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"고지식하다","漢字源（Hanja）":"","詞性":"形","中文意義":"死板，頑固","韓文例句":"형은 너무 고지식해요.","例句中文":"哥的想法已經過時了。","目標中文":"已經過時了","延伸單字":"고리타분하다 (陳腐) / 구식이다 (舊式) / 고집불통 (固執不通) / 《俗》똥고집 (-固執)","詳細解說":"在過去的韓國，人往往只因為年紀大就自視甚高。作為對此的反動，近來的年輕人開始將老賣老的言行視為「고지식하다（思想陳舊）」，並對此感到厭惡。「꼰대 인턴（老頑固實習生）」的原標題，講述了一位曾是權力騷擾上司的人成為下屬的故事。這樣「고지식한 사람（思想陳舊的人）」被稱為「꼰대（老頑固）」。「내가 형이지?（我是長輩吧？）」、「요즘 것들은（現在的年輕人啊）」、「나 때는 말이야（在我那個年代）」都是「꼰대」們常用的語句。拼音相近的「꼴통」則是指「不聽別人話，固執愚蠢的人」，常用於形容固執的孩子或同齡人。"}

{"ID":"173-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"융통성이 있다","漢字源（Hanja）":"融通性-","詞性":"","中文意義":"知道變通","韓文例句":"사고방식이 유연하고 융통성 있는 막내.","例句中文":"思考方式靈活、知道變通的忙內。","目標中文":"知道變通","延伸單字":"-","詳細解說":"在過去的韓國，重視禮儀，遵循長幼尊卑是理所當然的。但現在的年輕一代討厭陳舊的思維，例如「여자라서 남자니까」（因為是女性、因為是男性）的偏見，或是僅憑年齡和經驗就想佔上風的「꼰대질（老頑固行徑）」。他們喜歡不過多干涉他人生活方式，並追求各世代能夠「융통성 있게（靈活地）」共存的「문화다양성（文化多樣性）」。"}

{"ID":"174-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"예민하다","漢字源（Hanja）":"銳敏-","詞性":"形","中文意義":"敏感，神經質","韓文例句":"배고프면 예민해져요.","例句中文":"肚子一餓就開始暴躁。","目標中文":"暴躁","延伸單字":"민감하다 (敏感) / 날이 서다 (刀鋒銳利，神經敏銳) / 저기압 (低氣壓：心情不好)","詳細解說":"「예민하다」的意思是「敏感，脆弱」，例如「예민한 질문（尖銳的問題）」。「예민하게 굴다（表現得很敏感）」、「예민해지다（變得敏感）」則表示「神經戰兢兢」的意思。「예민한 사춘기」則指「敏感的青春期」。「거칠다（粗糙）」的同義詞「까칠하다（表面粗糙，不光滑）」也可用來描述「不友好，經常很暴躁，應對不慎重」等性格特徵。"}

{"ID":"175-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"뻔뻔하다","漢字源（Hanja）":"","詞性":"形","中文意義":"厚臉皮","韓文例句":"아줌마가 되니 뻔뻔해졌어요.","例句中文":"變成大嬸之後臉皮就開始厚了。","目標中文":"臉皮就開始厚了","延伸單字":"얼굴에 철판을 깔다 (臉包鐵皮=厚顏無恥)","詳細解說":"如果「뻔뻔하다」意味著「神經大條」，那麼「염치없다（廉恥-）」則是「不知羞恥」，例如「염치없이 찾아오다（厚臉皮地闖入）」。「目中無人」則稱為「안하무인（眼下無人）」，例如「안하무인 성격 때문에 전 남친과 헤어졌어요（她因為目中無人的性格而跟前男友分手了）」。「능글」、「능청」和「넉살」這些詞指的是「厚顏無恥，胡說八道，理直氣壯」，用於描述那些能夠若無其事地說謊或說出違心之論的人。"}

{"ID":"176-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"깔끔하다","漢字源（Hanja）":"","詞性":"形","中文意義":"清爽，俐落","韓文例句":"뒷정리까지 완벽한 깔끔한 남자.","例句中文":"連後續整理都要做到完美的人。","目標中文":"做到完美","延伸單字":"-","詳細解說":"「깔끔하다」用於表示性格時，指的是「乾脆俐落，不拖泥帶水」和「愛乾淨」。它廣泛用於形容房間「整齊且乾淨」、打扮或髮型「整潔」、口味「清爽」、說話「簡潔明瞭」以及處理工作「高效俐落」等。如果過於講究細節，就可能變成「예민하다」或「까다롭다（挑剔，難伺候）」。例如「식성（입맛）이 까다롭다（對吃的很挑剔）」。"}

{"ID":"177-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"털털하다","漢字源（Hanja）":"","詞性":"形","中文意義":"隨和，不拘小節","韓文例句":"방이 지저분해도 개의치 않는 털털한 여자.","例句中文":"房間丟得亂七八糟也毫不在意的懶散女子。","目標中文":"懶散","延伸單字":"지저분하다 (骯髒，邋遢) / 어수선하다 (雜亂無章) / 누추하다 (陋陋-：髒亂)","詳細解說":"「털털하다」是指「不拘小節，不做作」的性格，用於與整潔相關的形容則有「懶散馬虎」的意思。將「털털」和「깔끔」相對比，就是「懶散的人」和「愛整潔的人」。「不矯揉造作」也可以稱為「소탈하다（疏脫-）」。與此相對的「高傲」稱為「도도하다」，「裝模作樣」則是「새침하다」。「도도해 보이지만 의외로 털털해요」，就是「看似高傲，卻出乎意料地不做作」。「개의치 않다」是「개의하다（介意-：介意）」的否定形。"}

{"ID":"179-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"서투르다","漢字源（Hanja）":"","詞性":"形","中文意義":"不擅長","韓文例句":"황금 막내에게도 서투른 게 있다고?","例句中文":"黃金忙內竟然會有不擅長的事？","目標中文":"不擅長","延伸單字":"서툴다 (서투르다的另一種寫法)","詳細解說":"和「擅長」相比，韓語中「不擅長」的表達則不太為人所知。雖然使用「잘 못해요（不擅長）」也沒問題，但不妨藉此機會記住。「서투르다」通常與助詞「~이/가（的）」或「~에（在）」一起使用，例如「요리에 서툴러요（在烹飪方面不擅長）」。「它也用於表示「익숙하다（熟悉）」的反義詞「不熟悉」，例如「한국어가 서투른 외국인（對韓語不熟悉的外國人）」。若要表達「笨拙」，則用「솜씨가 서투르다」。若用「어설프다（生疏，不自然）」，則可以說「어설픈 한국어（生疏的韓語、不自然的韓語）」。"}

{"ID":"180-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"심정","漢字源（Hanja）":"心情","詞性":"名","中文意義":"心情","韓文例句":"지금 심정이 어떠신지?","例句中文":"您現在的心情如何呢？","目標中文":"心情","延伸單字":"《俗》멘탈갑 (mental甲：心理素質強韌的人)","詳細解說":"「心情」和「精神」在韓國是日常口語中經常使用的詞彙。「심정」被用作「마음（內心，心裡）」的替代詞。例如「내가 그 심정 알지（我懂那種心情）」、「그 때 심정을 가사에 담아 봤어요（我把那時的心情試著寫進了歌詞中）」。「멘탈（心理狀態）」也經常使用。容易受傷的心理狀態被稱為「유리멘탈（玻璃心）」或「두부멘탈（豆腐心）」。而「心理崩潰」以俗語稱作「멘탈붕괴（mental崩潰）」，簡稱「멘붕」。"}

{"ID":"181-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"정신","漢字源（Hanja）":"精神","詞性":"名","中文意義":"精神","韓文例句":"내 정신 좀 봐.","例句中文":"看一看我的精神=糟糕，不小心忘記了。","目標中文":"糟糕，不小心忘記了","延伸單字":"-","詳細解說":"許多慣用語都會用到「정신」這個詞。可以用「意識，心神」來解釋的例子有「정신을 잃다（失去意識）」、「정신이 들다（清醒=恢復意識）」、「정신 사납다（心神不定）」、「정신 차리다（打起精神=集中精神）」。例如「정신 똑바로 차려요.」（請保持警覺。）「정신이 없다（沒有心思）」指的是「忙得不可開交，手忙腳亂」，「정신을 팔다（賣掉精神）」是指「不專心，分心」，「정신이 나가다（精神離開）」則表示「心不在焉，恍神」。"}

{"ID":"182-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"진심","漢字源（Hanja）":"真心","詞性":"名","中文意義":"真心，誠心","韓文例句":"전하지 못한 진심을 말해요.","例句中文":"我要說出沒能傳達的真心話。","目標中文":"真心話","延伸單字":"-","詳細解說":"用漢字寫作「真心」，意指「沒有謊言和偽裝的心、真正的想法、認真、本心」。例如「나만 진심이었어…（只有我是認真的…）」、「진심이야.（我說的是真心話）」。在韓語中則是「정성（精誠）」或「성심（誠心）」。「정성을 듬뿍 담아서…（帶著滿滿的誠意…）」。「懇切地，衷心地」在韓語中是「간절히（懇切-）」，例如「간절히 바라다（我衷心期盼）」。"}

{"ID":"183-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"가식","漢字源（Hanja）":"假飾","詞性":"名","中文意義":"做作，虛偽","韓文例句":"가식적인 말들.","例句中文":"虛偽的話語。","目標中文":"虛偽的","延伸單字":"거짓 (謊言) / 《俗》뻥・구라 (謊話)","詳細解說":"指的是只做表面功夫的虛假姿態。例如「가식이 아니라 자신들의 진솔한 이야기를 담은 노래（不是虛飾，而是真誠地包含了自己故事的歌曲）」。「가식이 아니에요, 진심이에요.」（不是謊言，是真心的。）「저는 가식 같은 거 없어요.」（我沒有那種虛偽的一面。）「가식적（假飾的）」，則用來形容「가식적인 행동은（偽善的行為）」、「가식적인 웃음은（做作的笑容）」等。"}

{"ID":"184-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"자랑스럽다","漢字源（Hanja）":"","詞性":"形","中文意義":"自豪的","韓文例句":"자랑스러운 동생이야.","例句中文":"我引以為榮的弟弟。","目標中文":"引以為榮的","延伸單字":"-","詳細解說":"「자랑」是一個結合了「自豪」和「炫耀」意義的詞，加上「스럽다」後變成「自豪的、引以為榮的」。例如，「자랑스럽게 여기다（以此為榮、值得驕傲）」。「나는 자랑스러운 태극기 앞에…（我站在令人自豪的太極旗前…）」是對國旗的誓言中的一句。加上「하다」則變成動詞，炫耀的意思，比如「동생을 자랑하다（以弟弟為榮）」。「自豪感」在韓語中不是用「자랑을 갖다」，而是用「긍지（矜持：榮譽感）」或「자부심（自負心）」來表達。"}

{"ID":"185-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"민망하다","漢字源（Hanja）":"憫惘-","詞性":"形","中文意義":"丟臉，尷尬","韓文例句":"보는 내가 더 민망해요, 형.","例句中文":"哥，我看了都不好意思了。","目標中文":"不好意思了","延伸單字":"수모 (受侮：屈辱)","詳細解說":"與單純指「羞恥」的「부끄럽다」、「창피하다」不同，這裡涵蓋了「羞恥＋可憐＋焦急」的情感。例如，當自己在舞台上摔倒的時候，「민망했어요（真希望有個洞能鑽進去）」。伸手想握手卻被無視的時候，「이 손이 민망해…（這隻手該往哪擺…）」。「恥辱」在韓語中稱為「망신（亡身：丟臉）」，例如「망신 당하다（出糗，出醜）」、「망신시키다（使人蒙羞）」。"}

{"ID":"186-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"시원하다","漢字源（Hanja）":"","詞性":"形","中文意義":"暢快，爽快","韓文例句":"시원하게 대답해 드릴게요.","例句中文":"我會給你一個乾脆的回答。","目標中文":"乾脆的","延伸單字":"-","詳細解說":"針對食物、氣候等各種場合，用來表示「感覺舒適、暢快」的詞語是「시원하다」。電視或電影中對反派展開反擊，或者劇情發展得很有速度感時，這種感覺就像喝碳酸飲料時的「시원함（暢快感）」，在業界也稱為「사이다（cider：汽水）」。例如，「사이다 발언 시원하게 날려 줘（請說句讓人暢快的話）」。加上「속（肚子）」後就變成「속 시원하다」，也有「感覺暢快=爽快」的意思。"}

{"ID":"187-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"답답하다","漢字源（Hanja）":"","詞性":"形","中文意義":"煩悶，焦躁","韓文例句":"어우 정말 답답한 사람이네.","例句中文":"啊~真是令人煩躁的人。","目標中文":"煩躁的","延伸單字":"고구마 전개 (緩慢而令人不耐煩的進展)","詳細解說":"感覺「不爽快，心煩意亂，焦躁」時，就可以說「답답하다」。比如，「보는 내가 답답하다（光看著就讓人覺得很煩躁）」。有時則會用吃芋頭卡在喉嚨的「고구마（地瓜）」來比喻遲鈍或節奏不佳的情況。例如，「고구마 먹다 체한 기분이야. 너무 답답해.」（就像吃地瓜卡在喉嚨，太讓人不耐煩了。）"}

{"ID":"188-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"뿌듯하다","漢字源（Hanja）":"","詞性":"形","中文意義":"心滿意足，高興","韓文例句":"뭔가 되게 뿌듯한 한 해였어요.","例句中文":"總覺得度過了相當充實的一年。","目標中文":"充實的","延伸單字":"오지다 (滿足，오지게 有「非常，超級」的意思。 / 【俗語，年輕人用語】常用來表示「超強，超屌」。)","詳細解說":"表示「感到滿足、心滿意足」時，雖然可以用漢字詞「만족스럽다」，但更常用的是固有語「뿌듯하다」。例如，「형이 상 받아서 내가 다 뿌듯해요（哥哥得獎了，我很替他高興）」。「뿌듯하다」和「기쁘다（高興）」相比，更多了一種「心中充滿喜悅」的感覺。表示「滿足的臉」的字卡通常會打上「뿌듯」。"}

{"ID":"189-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"섭섭하다","漢字源（Hanja）":"","詞性":"形","中文意義":"不夠滿意，惋惜","韓文例句":"나한테 뭐 섭섭한 거 있어?","例句中文":"你對我有什麼不滿嗎？","目標中文":"不滿","延伸單字":"시원찮다 (不怎麼滿意，身體不怎麼舒服)","詳細解說":"表示「不滿足，心有未甘」時，雖然可以用「불만스럽다（不滿-）」，但更常用的是「섭섭하다」。「섭섭하다」包含了「悲傷＋不滿足」的意思。例如，「배부르지만 남기면 섭섭하죠?」（雖然吃飽了，但如果剩下不是有點可惜嗎？）「서운하다」也有相同的意思。比如，「나한테 서운한 거 없어요?」（你對我有什麼不滿嗎？）在連續劇拍攝結束後，許多演員會表示自己感到「시원섭섭하다（爽快卻又寂寞 = 高興卻又有點惋惜）」。"}

{"ID":"190-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"신나다","漢字源（Hanja）":"","詞性":"動","中文意義":"開心，興奮","韓文例句":"아무거나 신나는 음악 틀어 봐.","例句中文":"放一點帶動的音樂吧。","目標中文":"帶動的","延伸單字":"신나신나 (興奮貌)","詳細解說":"除了「재미있다 (有趣)」和「즐겁다 (快樂)」以外，用來表示「愉快」的詞彙。有「情緒高漲，興奮」的意思。例如，「어제 형이랑 신나게 놀았어요.」（昨天跟哥玩得很開心。）「신나다」中的「신」表示「興高采烈的情緒，情緒高漲」。「신명」、「신바람」、「흥 (興)」也有相同的意思。要闡述感想時，如果只說「아주 재미있었어요.」（很有趣）就會顯得單調，可以改說「신나고 재미있었어요.」重複強調「很開心」的意思。「재미있다」也可以寫成「재밌다」。"}

{"ID":"191-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"다운되다","漢字源（Hanja）":"down-","詞性":"動","中文意義":"情緒低落","韓文例句":"왜 그렇게 다운돼 있어?","例句中文":"你為什麼心情這麼低落？","目標中文":"低落","延伸單字":"시시하다 (微不足道，無聊)","詳細解說":"「다운되다」意思是「情緒低落」。「心情很低落」就是「기분이 다운 되다」。「기분 나쁘다 (感覺很差)」或「기분 안 좋다 (感覺不好)」，在韓語中是「不開心，生氣」的意思，而不是指「身體不舒服」，還請留意使用方式。年輕人會用「분위기가 싸하다」表示「怪異的氛圍，微妙的氛圍」。「突然冷場」則是「갑분싸」，省略自「갑자기 분위기가 싸하다 (氛圍突然凍掉)」。"}

{"ID":"192-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"욱하다","漢字源（Hanja）":"","詞性":"動","中文意義":"生氣，動怒","韓文例句":"욱해서 미안해요.","例句中文":"很抱歉突然發了火。","目標中文":"發了火","延伸單字":"짜증 (不耐煩，發脾氣) / 짜증이나다 (火大起來)","詳細解說":"副詞「욱」是表示激烈的情感湧上。「動怒之後做了~（某事）」就是「욱하는 마음・심정에~」。例如「욱하는 마음에 한 말（一時生氣說出的話）」、「욱하는 성격（容易暴怒的性格）」。「화 (火)」和「열 (熱)」也有「發怒」的意思。例如「화가 많이 나.（非常生氣）」「화내지 마세요.」（請不要生氣）「열받아（火冒三丈）」。要安撫生氣的人時，則可以說「화 풀어 요.」（請冷靜一下。）"}

{"ID":"193-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"짠하다","漢字源（Hanja）":"","詞性":"形","中文意義":"難受，傷心","韓文例句":"네가 우는 거 보면 마음이 짠해.","例句中文":"看見你哭，我也覺得很難受。","目標中文":"難受","延伸單字":"애절하다・애틋하다 (哀切-：悲痛) / 울상 (-相：哭臉，快哭的臉) / 울보 (愛哭鬼) / 대성통곡 (大聲痛哭：號泣)","詳細解說":"「슬프다 (悲傷)」的其他表達方式。「가슴이 짠하다」可用來表示「心痛」。「마음이 짠해 지다」則意指「感到心碎」。「感到可憐」可用「애처롭다」或「딱하다」表達。例如「그 친구 사정이 너무 딱해서 마음이 아파요.」（他的情況令人同情，讓人心痛。）而「想哭」則可用「울먹거리다」或「울먹이다」表達。「울컥」則表示情感湧上，既可用於憤怒也可用於悲傷。「눈물이 핑 돌다」表示「淚水奪眶而出」，「눈시울이 뜨거워지다」則表示「熱淚盈眶」。"}

{"ID":"194-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"신기하다","漢字源（Hanja）":"神奇-","詞性":"形","中文意義":"神奇","韓文例句":"이거 되게 신기하지 않아요?","例句中文":"這也太神奇了吧？","目標中文":"神奇","延伸單字":"《俗》레전드 (傳奇) / 《俗》넘사벽 (等級不同，無與倫比) / 《俗》역대급 (歷代級：歷代頂級，史無前例)","詳細解說":"「신기하다」的翻譯是「神奇」，但也用於表示讚嘆或驚歎的情況。年輕人常使用「대박」、「쩐다」、「헐」等詞表示「超厲害，超強」的意思。有時也會加上「신기하다」，例如「대박이다, 신기해.」（超強的，超神）。而用來表達「創新又厲害」的新造語「신박하다」也被廣泛使用，例如「그 아이디어 신박하다.」（這個想法太新奇，太厲害了。）"}

{"ID":"195-1","章節（PART）":"PART 4 比較一下表達性格・情感的單字吧","單字（韓文）":"흔하다","漢字源（Hanja）":"","詞性":"形","中文意義":"平常，不足為奇","韓文例句":"그거 너무 흔하지 않아요?","例句中文":"這豈不是很常見嗎？","目標中文":"很常見","延伸單字":"잦다 (頻繁)","詳細解說":"「平常」就是「沒多厲害」的意思，例如「흔한 일 (平凡的事情)」。這個詞也可以改成否定形來表達，例如「흔치 않다 (不常見)」。當答案或結果「顯而易見、已知時」，就可以使用「뻔하다」。例如，「불 보듯 뻔한 일 (明顯得如同看見火)」、「안 봐도 비디오 (不看也是video=不用看也有畫面)」，都是表示「明顯，無庸置疑」的慣用語。「~ 뻔하다」則表示「差點就~了」的意思。例如「내가 없었으면 어쩔 뻔했어.」（要是我不在的話該怎麼辦？）"}

{"ID":"198-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"건강하다","漢字源（Hanja）":"健康-","詞性":"名","中文意義":"健康","韓文例句":"여러분 잘 지내세요? 저희는 건강하게 잘 있어요.","例句中文":"大家都過得好嗎？我們都很好喔。","目標中文":"都很好喔","延伸單字":"파이팅 넘치다 (充滿活力) / 쌩쌩하다 (活蹦亂跳)","詳細解說":"「很好」是個基本用語，但無法直譯。可以簡單地用「잘 있다」或「잘 지내다（過得好）」來表示，有時也會用「안녕하다（安寧）」。久別重逢時問「大家都過得好嗎？」可以使用「그동안 잘 지내셨어요?」或「안녕하셨어요?」。告別時說「保重」，可以用「잘 지내세요」。加上「건강하게（保重健康）」或「아프지 말고（不要生病）」等詞語，會變得更有變化。詢問對方是否安好被稱為「안부 인사（安否人事：詢問問候）」。"}

{"ID":"199-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"기운이 없다","漢字源（Hanja）":"","詞性":"名","中文意義":"沒力氣，沒精神","韓文例句":"기운이 없고 입맛도 없어요.","例句中文":"無精打采又沒食慾。","目標中文":"無精打采","延伸單字":"-","詳細解說":"形容「不太好」並不是用「잘 있지 않다」，而是用「기운이 없다 (沒精神)」或「힘이 없다 (沒力氣)」。這裡的「力氣」並不是指體力，而是指沒有活力。「感覺不舒服，身體不適」，可以用「아프다 (生病)」，例如「아파 보여요 (看起來很不舒服)」。用英語的「컨디션 (condition：狀態)」來表示，例如「컨디션이 안 좋아 (狀態不好)」，也是種表示身體狀況不佳的說法。「注意身體」可以用「몸 조심하다」、「몸 관리 잘하다」及「건강 잘 챙기다」等。"}
,
{"ID":"200-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"관심 있다","漢字源（Hanja）":"關心-","詞性":"名","中文意義":"有興趣","韓文例句":"뮤지컬에도 관심 있어요.","例句中文":"我對音樂劇也很有興趣。","目標中文":"有興趣","延伸單字":"관심거리 (關注的事)","詳細解說":"韓國中雖然也存在「흥미 (興味)」一詞，但往往會用「관심 (關心)」來替代。在電影或影集的發表記者會上，常會聽到「많은 관심 부탁드립니다 (請多多關照)」，這句話用得非常頻繁，甚至衍生出了縮寫「많관부」。「非常有興趣」是「관심 많다」，例如「저 패션에 관심이 많아요 (我對時尚非常感興趣)」。「開始對某事產生興趣」則用「관심이 가지다」。提到了「關心事」，則可以問「요즘 최대 관심사는?」（你最近對什麼有興趣呢？）"}
,
{"ID":"201-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"관심 없다","漢字源（Hanja）":"關心-","詞性":"名","中文意義":"沒興趣","韓文例句":"원래 아이돌에 관심 없었어요.","例句中文":"我原本對偶像沒什麼興趣。","目標中文":"沒興趣","延伸單字":"-","詳細解說":"「沒興趣」常用於明確拒絕某人的台詞中，例如「관심 없다 너한테 관심 없어.」(我對你沒興趣)。在電視劇中，「관심 꺼」(停止你的關心=與你無關) 這句台詞也經常出現。「漠不關心」是「무관심」，用語則寫成「노관심 (no關心)」。「人們對他人漠不關心 (사람들은 남에게 관심 없다)」這種說法，總讓人感到寂寞。所以有時會說「조금은 관심 가져 주세요 (多少關心一下吧)」。"}
,
{"ID":"202-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"인사","漢字源（Hanja）":"人事","詞性":"名","中文意義":"問候，打招呼","韓文例句":"인사드리겠습니다. 둘 셋!","例句中文":"向大家問聲好。預備～(2、3)！","目標中文":"問聲好","延伸單字":"새해 인사 (新年問候) / 추석 인사 (中秋問候)","詳細解說":"韓語中沒有早晨、中午和晚間的特定問候語。說「早」，時，可使用相當於英語「Good morning」的韓語，「좋은 아침 (美好的早晨)」。問候的禮節已經融入日常生活中。「인사 받으세요 (請接受我的問候)」是在新年或久未見面的親戚之間，下位者對上位者問候時使用的語句。當上位者「고개만 까 딱 (微微點頭)」時，下位者則須彎腰鞠躬。而在「악수 (握手)」時，如果上位者使用「한 손 (單手)」，下位者則應該使用「두 손 (雙手)」，每個場合都有其對應的禮儀。"}
,
{"ID":"203-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"절","漢字源（Hanja）":"","詞性":"名","中文意義":"行禮，跪拜禮","韓文例句":"새해니까 우리 절 한번 제대로 해 봅시다.","例句中文":"新年到了，我們好好行個禮吧。","目標中文":"行個禮","延伸單字":"-","詳細解說":"在日本，即使是最為尊敬的行禮，也只是將身體前傾45度鞠躬。但在韓國，最為恭敬的問候方式是「큰절 (行大禮)」，這需要將手臂舉到眼睛高度然後蹲下，將額頭觸及地面。這樣的行禮於婚禮、葬禮或法事等場合。「下跪」是「무릎을 꿇다」。在「절 (寺廟)」進行的是佛教式的「절 (跪拜禮)」，這是將「五體投地」的動作簡化後的形式，即雙膝跪下並將額頭貼地，同時手掌朝上。"}
,
{"ID":"204-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"감사드립니다","漢字源（Hanja）":"感謝-","詞性":"名","中文意義":"感謝","韓文例句":"정말 사랑하고 감사드립니다.","例句中文":"真的很愛大家，感謝大家。","目標中文":"感謝","延伸單字":"-","詳細解說":"「감사하다」和「고맙다」的差異只在於分別是漢字詞和固有語，意思上則都是表示感謝。不過由於「감사합니다」和「감사드립니다」都是源自漢字，給人時，人們會使用漢字詞來表達，這類的詞語包括「감사합니다」或「감사드립니다」。例如，他們可能會說「여러분들 덕분에 이런 멋진 상을 받게되어 너무너무 감사드립니다.」(託大家的福，我才能夠獲得這個美妙的獎項，真的非常感謝大家。)"}
,
{"ID":"205-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"고맙습니다","漢字源（Hanja）":"","詞性":"名","中文意義":"謝謝","韓文例句":"노래 아주 잘하시네요. - 고맙습니다.","例句中文":"您真的很會唱歌。 - 謝謝。","目標中文":"謝謝","延伸單字":"-","詳細解說":"韓語學習者會傾向使用「감사합니다」，但在口語中「고맙습니다」的使用頻率更高。孩子們經常會使用，大人也會在想要表現非正式感時使用它。「고마워요 (gomawoyo)」有時可能被視為失禮，所以在與同輩或晚輩交流時使用較為安全。相反地，大人對孩子說「감사합니다」可能會顯得有些不自然。過度使用「고마워」(gomawo) 也可能讓彼此變得生疏，所以不妨換個表達方式，如「아이고 예뻐라」(哎呀，你真聰明)。不過，為了教育孩子說話要禮貌，大人有時也會對孩子說「고마워요」。"}
,
{"ID":"206-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"도와주세요","漢字源（Hanja）":"","詞性":"名","中文意義":"幫幫忙","韓文例句":"고수님들 도와주세요.","例句中文":"希望可以請各位專家幫幫忙。","目標中文":"幫幫忙","延伸單字":"도우미 (家務或照護的服務員、支援者、陪護)","詳細解說":"同樣是「請幫幫我」，在請求協助時會用「돕다 (幫助)」。商店店員問顧客「您在找些什麼嗎？」的時候，會用「고객님 무엇을 도와드릴까요」(客人，您需要什麼幫助嗎？) 也可以使用「돕다」的名詞形式「도움」來表達。「도움을 주다」是「幫助他人」，「도움을 받다」是「接受幫助」，「도움이 되다」則是「有幫助的，有用的」。「도움이 많이 됐어요」的意思是「真的幫助很大，非常感謝」。"}
,
{"ID":"207-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"살려 주세요","漢字源（Hanja）":"","詞性":"名","中文意義":"救救我","韓文例句":"거기 누구 없어요? 사람 살려 주세요.","例句中文":"有人在嗎？拜託救救我。","目標中文":"救救我","延伸單字":"-","詳細解說":"「救命」可以用「살리다 (使~活下來)」來表達，說成「살려줘」或「사람 살려」。「제발 목숨만은 살려 주세요 (拜託饒我一命吧)」是乞求活命的場景中經典的台詞。即使不是攸關性命的情況，也可以用「덕분에 살았어요 (多虧有你，我才能活下來)」來表示受到了莫大的幫助。鬆了一口氣，想說「太好了，得救了」的時候，可以說「살았다 (我活下來了)」；相反地，如果想表示「完了，這下沒救了」時，則可以說「죽었다 (死了)」、「망했다 (完了)」，或是「끝장이다 (完蛋)」等表達。"}
,
{"ID":"208-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"말이 짧다","漢字源（Hanja）":"","詞性":"","中文意義":"說話不敬","韓文例句":"너 선배한테 말이 좀 짧다?","例句中文":"你這是跟前輩說話的口氣嗎？","目標中文":"口氣","延伸單字":"-","詳細解說":"韓語中的「非敬語」稱為「반말 (半語)」(譯註：即不完整或非正式的語言)。想告誡對方不要用「반말」講話時，會使用「말이 짧다 (話很短)」來表達。對初次見面的人使用「반말」，是違反禮儀的。在這種情況下可能會聽到「왜 말이 짧으세요? 저 아세요?」(為什麼對我用那種語氣？你認識我嗎？) 而即使是認識的人，也不可以對上位者使用「반말」。在提醒下上位者可能會用「너 말이 짧다?」(你這是在用語氣嗎？) 或「어디서 반말이야.」(你這是在跟誰說話？) 來提醒或警告。"}
,
{"ID":"209-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"말을 놓다","漢字源（Hanja）":"","詞性":"","中文意義":"不說敬語","韓文例句":"우리 말 놓고 편하게 지내요.","例句中文":"我們別說敬語，放輕鬆點說話吧。","目標中文":"別說敬語","延伸單字":"-","詳細解說":"「敬語」稱為「존댓말 (尊待-)」或「높임말」。這種語言形式通常用於與年齡或職位高於自己、「어려운 관계」(需要謹慎以對的關係) 或初次見面的人交談。另一方面，為了打破僵局或不自然的關係，有時人們會選擇使用更親密的「반말 (平語，非敬語)」來代替「존댓말」。提出「我們不使用敬語好嗎？」時，韓語會說「우리 말 놓을까요?」(我們放下言辭吧？)，意味著提議雙方可以用更親密、更自在的語言交談。「어렵다 (感到不自在)」的相反是「편하다 (感到自在)」，所以使用「편하게 이야기하다 (舒適地交談)」也表示「不說敬語」的意思。"}
,
{"ID":"210-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"가르치다","漢字源（Hanja）":"","詞性":"動","中文意義":"教導，教","韓文例句":"형이 가르쳐 줄게.","例句中文":"讓哥來教你。","目標中文":"教","延伸單字":"-","詳細解說":"在表現理想人際關係的「五倫」中，「長幼有序 (長幼有序)」充分展現了儒家的上下關係如何運作。上位者是處於「教導」下位者的地位。不僅僅是像「한국말을 가르치다 (教韓語)」這類技術或知識的傳授，還具備「教導與引導」的能力。祈求幸運和成功的「吉祥話」稱為「덕담 (德談)」。除了上位者用來給予下位者祝福外，家庭成員、同事、朋友之間也可以彼此祝福。然而，在當今時代，像「올해는 결혼해야지 (今年趕快結婚吧)」這樣的「덕담」則可能被視為「오지랖 (多管閒事)」。"}
,
{"ID":"211-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"따르다","漢字源（Hanja）":"","詞性":"動","中文意義":"跟隨，遵從","韓文例句":"형 말에 따를게요.","例句中文":"我會遵從哥的建議。","目標中文":"遵從","延伸單字":"따라 하다 (模仿)","詳細解說":"「遵從」上位者的教導是下位者應有的舉止。例如「형 따라 했어요.」(我已經照哥哥的指示做了)。然而，如果是年輕上司加上年長部下這種上下翻轉的組合，地位關係就會變得難以掌握。以偶像團體為例，假設團體中的「동생 (弟弟)」比「형 (哥哥)」更會唱歌，舞蹈水準也更好。即使處於這種難受的狀態下，也還是樂意追隨弟弟們一起工作的大哥，便能稱得上是有度量的人。"}
,
{"ID":"212-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"챙기다","漢字源（Hanja）":"","詞性":"動","中文意義":"照顧","韓文例句":"생일 챙겨 줘서 고맙습니다.","例句中文":"謝謝你們還想到我的生日。","目標中文":"想到","延伸單字":"-","詳細解說":"「챙기다」是一個在韓語中經常使用卻難以直譯的詞語。它的本意是「為某物充分做好準備」，但當用於描述對人的行為時，「챙기다」指的是在關心對方的同時做各種事情，從「請客吃飯」到「慶祝生日」都包括在內。「형 생일 잘 챙겨 주는데 조금 과할 때가 있어요.」(哥哥真的會照顧我，但有時候也會照顧過頭了。)"}
,
{"ID":"213-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"의지하다","漢字源（Hanja）":"依支-","詞性":"動","中文意義":"依賴","韓文例句":"막내가 형을 의지하고 있어요.","例句中文":"老么很依賴哥哥。","目標中文":"依賴","延伸單字":"매달리다 (糾纏)","詳細解說":"儒家的上下關係並不一定只對上位者有好處。如果上位者對下位者「關心照顧」，那麼下位者對上位者也會有「依賴和接受好意」的一面。「依賴」被稱為「의지하다」。在戲劇和電影拍攝結束後，常見的感想就是「서로 의지하면 서 촬영했어요.」(我們在互相支持下進行了拍攝。) 然而，就像日本出現了「不想參加上司飲酒聚會的年輕人」，這種有人情味的上下關係在韓國也逐漸變得淡薄。"}
,
{"ID":"214-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"자존심","漢字源（Hanja）":"自尊心","詞性":"名","中文意義":"自尊心","韓文例句":"저도 자존심이라는 게 있거든요.","例句中文":"我也是有自尊心的。","目標中文":"自尊心","延伸單字":"기 싸움 (爭奪權力，爭奪主導權)","詳細解說":"教養孩子時，會重視「자존심 지키기 (保護他們的自尊心)」。「기가 죽다 (氣餒)」意味著感到自卑。當在比賽中處於失利的時候，通常會用「기 죽지 마 (不要氣餒)」來鼓舞士氣。「무시당하다 (被忽視，被瞧不起)」，是一種屈辱，但只要做父母將「기를 살리는 육아 (激勵式教養)」謹記在心，孩子就不會變成只能默默承受的「기가 죽은 아이 (氣餒的孩子)」。"}

{"ID":"215-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"눈치","漢字源（Hanja）":"","詞性":"名","中文意義":"臉色，察言觀色","韓文例句":"왜 형 눈치를 보는데?","例句中文":"幹嘛老是看哥的臉色？","目標中文":"臉色","延伸單字":"-","詳細解說":"韓國人也同樣會在意周遭的眼光。在日本常說「讀空氣」，韓國則是說「눈치를 보다」。尤其是指針對上位者，「顧慮對方的感受，揣測其情緒與意圖」。「눈치가 없다」就相當於「不會看臉色」。在公司等組織中，如果上位者過度要求下屬「눈치를 봐 달라」，可能會導致「갑질 (權勢霸凌)」等問題。無論上下關係，都可以使用「눈치가 빠르다」來描述「直覺敏銳，很會察言觀色」。「눈치를 채다」是「察覺，看出來」的意思。"}

{"ID":"216-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"꽂다","漢字源（Hanja）":"","詞性":"動","中文意義":"插入","韓文例句":"빨대 꽂고 마셔요.","例句中文":"插入吸管即可飲用。","目標中文":"插入","延伸單字":"찌르다 (戳)","詳細解說":"插上「이어폰 (耳機)」、「빨대 (吸管)」、「충전기 (充電器)」、「머리핀 (髮夾)」等東西的動作稱為「꽂다」。使用了「꽂이 (~插)」的詞彙有「우산꽂이 (雨傘座)」、「연필꽂이 (筆筒)」、「책꽂이 (書架)」、「꽃꽂이 (插花)」。被刺入是「검이 꽂히다」。「꽂히다」則可以用來表示「入迷，著迷」的意思，比如「처음 듣자마자 꽂힌 노래 (一聽就迷上的歌)」。把食物用竹籤刺在一起的「串」是「꼬치」，「烤雞串」就是「닭꼬치」。"}

{"ID":"217-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"빼다","漢字源（Hanja）":"","詞性":"動","中文意義":"拔出，拿下","韓文例句":"귀걸이 예뻤는데 뺐어?","例句中文":"耳環明明很好看，怎麼拿掉了？","目標中文":"拿掉了","延伸單字":"-","詳細解說":"拿掉隱形眼鏡、戒指、手錶等物品時，使用的動詞是「빼다」。「빼먹다」的意思則是「忘記，遺漏」。比如，「뭔가 빼먹은 거 있나요? (有什麼遺漏的東西嗎？)」。在韓劇《鬼怪》中，胸口被劍刺中的鬼怪所說的「검 뽑아 줘.」意思是「幫我把劍拔出來」。「뽑다」也有「選擇」的意思，比如「粉絲挑選的歌曲」，就是「팬들이 뽑아 준 곡」。另外，鈕扣是用「풀다 (解開)」，手套和眼鏡則用「벗다 (取下)」。"}

{"ID":"218-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"틀다","漢字源（Hanja）":"","詞性":"名","中文意義":"開啟","韓文例句":"에어컨 틀어 줘요.","例句中文":"請把空調打開。","目標中文":"打開","延伸單字":"-","詳細解說":"「打開」開關是用「켜다」，「틀다」則是指「(轉動) 使其運轉」的意思 (譯注：即英語的「turn on」)。這可能是由轉動開關的形象引申而來，包括「라디오 (收音機)」、「음악 (音樂)」、「선풍기 (風扇)」、「에어컨 (空調)」等，都可以使用「틀다」。而對於打開「카메라 (相機)」、「모니터 (顯示器)」、「라이브 (直播)」等，通常使用「켜다」。社群媒體上的「하트」(點讚按鈕)，則是用「누르다 (按壓)」。例如，「하트 많이 눌러 주세요.」(請多多點讚。)"}

{"ID":"219-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"끄다","漢字源（Hanja）":"","詞性":"動","中文意義":"關閉","韓文例句":"폰을 왜 꺼 놨어?","例句中文":"為什麼要把手機關機？","目標中文":"關機","延伸單字":"-","詳細解說":"「關掉、切斷」通常用「끄다」。「關燈」可以說「불을 끄다」，「吹熄蠟燭的火」可以說「촛불을 끄다」。比如，「불 끄고 얼른 잡시다.」(關燈然後快去睡吧。) 也可以用在即將結束直播配信時，也可以說「1분만 있다가 끌게요.」(再過1分鐘我就關掉囉=結束囉)。「掛斷電話」通常用「전화를 끊다」。其他一些表示「切斷」的情況也可以整理一下：用剪刀等剪斷通常用「자르다」，用刀、刮刀等鋒利的刀具切斷用「베다」，而剪紙或剪布則用「오리다」。"}
,
{"ID":"220-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"만들다","漢字源（Hanja）":"","詞性":"動","中文意義":"製作","韓文例句":"정성스레 만든 눈사람.","例句中文":"精心製作的雪人。","目標中文":"製作","延伸單字":"-","詳細解說":"「잘 만들다」的過去式是「잘 만들었다」，意思是「做得很好」。例如，「이 노래 좋다. 되게 잘 만들었다.」(這首歌很棒，做得非常出色。) 在「쿡방 (cook放：料理節目)」等中，偶像們有時會親自烹飪或手工製作東西。「手工製作」通常用「수제 (手製)」。例如，「수제 초콜릿 (手作巧克力)」、「수제 스무디 (手作果汁)」。如果要表示「親手製作」，則可以說「직접 만들다 (直接製作)」。例如，「본인이 직접 만들었대요.」(據說是他本人親手製作的。)"}
,
{"ID":"221-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"부수다","漢字源（Hanja）":"","詞性":"動","中文意義":"弄壞","韓文例句":"파괴왕이 또 부쉈네.","例句中文":"破壞王又弄壞東西了。","目標中文":"弄壞","延伸單字":"엉망진창 (亂七八糟)","詳細解說":"你可能已經知道「고장나다 (故障：壞掉)」或「파괴하다 (破壞)」等漢字詞，但「弄壞」的固有語是「부수다」。例如，「부숴 버릴 거야.」(我要把它弄壞。) 或「라면을 부숴 먹다 (把泡麵弄碎再吃)」等。「打碎」是「깨다」，「弄破、弄壞」可以說成「깨다」或「깨뜨리다」，「打碎」則是「때려 부수다」。「망가지다 (壞掉)」可以用來表示髮型等變得「一團糟」，也可用於形容人「變得瘋狂」。例如，「망가지는 역할 (壞掉的角色)」。"}

{"ID":"222-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"잡다","漢字源（Hanja）":"","詞性":"動","中文意義":"抓住","韓文例句":"저 감 잡았어요.","例句中文":"我抓到訣竅了！","目標中文":"抓到","延伸單字":"시선 강탈 (視覺強奪：吸睛) / 취향 저격 (趣向狙擊：我的菜)","詳細解說":"表示「抓住」的「잡다」，可以用來抓住房各種事物。「擒獲」粉絲是「사람을 잡다」，「抓住了心」是「마음을 사로잡다」。想像「抓住白雲」是「뜬구름 잡다」。「彆腳」是「트집을 잡다」。如果是抓住「흠 (缺陷，缺點)」則是「흠잡다」。「當抓住「발목 (腳踝)」，表示「扯後腿」，抓住「생사람 (無辜的人)」，則表示「(對方在沒有犯錯的情況下) 被不合理地指責或遷怒」。"}

{"ID":"223-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"놓치다","漢字源（Hanja）":"","詞性":"動","中文意義":"放走","韓文例句":"저 박자 놓쳤어요.","例句中文":"我不小心掉拍了。","目標中文":"掉拍","延伸單字":"-","詳細解說":"要形容「沒能抓住」可以用「놓치다」。「錯過時機」是「타이밍을 놓치다」，和第一名擦身而過，是「1등을 놓치다」，「掉拍」則是「박자를 놓치다」。公車或電車也可使用「놓치다」表示，例如「막차를 놓치다 (沒趕上末班車)」。「看漏，沒看出來」也可以用「놓치다」，例如「뭔가 놓친 게 있는 것 같은…」(總覺得好像漏掉了什麼……)。「特意放過」則可以用「봐주다」表示，例如「한 번만 봐주세요.」(這次就拜託通融一下。)"}

{"ID":"224-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"채우다","漢字源（Hanja）":"","詞性":"動","中文意義":"填滿，使～充滿","韓文例句":"하트로 꽉꽉 채워줄게.","例句中文":"給你刷一波滿滿的愛心。","目標中文":"滿滿的","延伸單字":"메우다 (填充，塞住) / 보태다 (補充，補貼)","詳細解說":"「채우다」是「차다 (充滿)」的他動詞或使役動詞形態。它的意思是「填滿～」或「使～充滿」。用酒「填滿杯子」可以說「잔을 채우다」，「填補缺點」可以說「부족함을 채우다」，「充滿愛」可以說「사랑으로 채우다」，「充滿喜悅」則可以說「기쁨으로 채우다」。如果想強調充滿的感覺，也可以使用「꽉 채우다 (塞滿，填滿)」或「가득 채우다」。"}

{"ID":"225-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"비우다","漢字源（Hanja）":"","詞性":"動","中文意義":"空出，騰出","韓文例句":"다음 주 스케줄은 싹 다 비워 놨어.","例句中文":"我已經把下禮拜的行程都空出來了唷。","目標中文":"空出來","延伸單字":"빈틈 (空下來的間隙=空隙) / 빈칸 (空下來的欄位=空格) / 빈자리 (空下來的座位=空位)","詳細解說":"「비우다」是「비다 (空著)」的他動詞或使役動詞形態。它的意思是「使～空」。例如，「집을 비우다 (空出家裡=不在家)」、「자리를 비우다 (空出座位=離席)」、「마음을 비우다 (空出心靈=淨空心靈，放下慾望)」、「잔을 비우다 (讓杯子空掉=喝光)」。預先空出來，也可以用「비워 놓다」或「비워 두다」來表示。例如，「노약자석은 비워 두세요.」(請保留博愛座給需要的人。)"}

{"ID":"226-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"마중","漢字源（Hanja）":"","詞性":"名","中文意義":"迎接","韓文例句":"오빠가 마중 나가 줄까?","例句中文":"哥會來接我嗎？","目標中文":"接","延伸單字":"픽업 (pick up：幼稚園或機場、飯店等的接送)","詳細解說":"「마중」源自「맞이하다 (迎接)」，可用於「마중하다 (迎接)」或「마중 나가다 (前往迎接)」等表達。「我去接你」可以說「데리러 갈게」。敬語的「恭迎」是「모시다 (引導，陪同)」，通常使用「모시다 (引導，陪同)」這個詞。「前往恭迎」是「모시러 가다 (前往引導)」，而「恭迎來」則是「모셔 오다 (引導過來)」。嘉賓登場時的通知則可以說「손님을 모시겠습니다 (我們將會恭迎嘉賓)」。"}

{"ID":"228-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"흘리다","漢字源（Hanja）":"","詞性":"動","中文意義":"流，灑落，遺落","韓文例句":"지갑 흘리셨어요.","例句中文":"你的錢包掉了喔。","目標中文":"掉了","延伸單字":"-","詳細解說":"「흘리다」既可解釋為「피와 땀과 눈물을 흘리다 (流血、流汗、流淚)」的「流」，也可以理解為「灑落、遺落」的意思。「一邊吃，一邊把飯灑出來」可以說「밥을 흘리면서 먹다」。要告訴別人「你錢包掉了」時，你可能會先想到「떨어뜨리다 (掉落)」，但更好的表達是用「흘리다」。表示「不小心遺落」。「哥勸你不要弄丟手機」，可以說「형이 스마트폰을 흘리고 다녀요.」"}

{"ID":"229-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"내리다","漢字源（Hanja）":"","詞性":"動","中文意義":"沖水","韓文例句":"화장실 사용 후 물을 꼭 내려 주세요.","例句中文":"使用馬桶後請務必沖水。","目標中文":"沖水","延伸單字":"-","詳細解說":"沖 (馬桶) 水的動詞不會用「흘리다」來表示，只要看廁所中設置的韓語說明就可以確認這點。「沖馬桶水」的韓語是「화장실 물을 내리다」。「내리다」一詞有時會用來表示(雨或雪)「降下，落下」。補充：韓語「領錢」的動詞是使用「찾다 (提取)」。「찾다」是「取回預存的物品」的意思，例如「돈을 못 찾았다.」(沒辦法領錢。)"}

{"ID":"230-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"잊어버리다","漢字源（Hanja）":"","詞性":"動","中文意義":"忘記","韓文例句":"단어를 외워도 금방 잊어버려요.","例句中文":"就算背了單字也馬上就忘了。","目標中文":"忘了","延伸單字":"잊으신 물건 분실물 (忘記的東西，遺失物)","詳細解說":"「잊어버리다」是用來表示「遺忘，記憶消失」。韓語中表示「啊，我忘記寫作業了」時通常會說「숙제 (를) 잊어버렸어요」。不過也可以用「깜빡하다 (疏忽，忽略)」，或「깜빡 잊다 (不小心忘記)」這兩個詞更常使用。「깜빡」是表示光的閃爍，用來描述記憶的浮現或消失。例如：「숙제를 깜빡 잊고 있었어 (我不小心忘記寫作業)」、「드라마 제목을 깜빡했어 (我忽然忘記了劇名)」。"}

{"ID":"231-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"두고 오다","漢字源（Hanja）":"","詞性":"動","中文意義":"忘記帶","韓文例句":"지갑을 집에 두고 왔어요.","例句中文":"我把錢包忘在家裡了。","目標中文":"忘","延伸單字":"-","詳細解說":"要說「啊，我忘了帶錢包」時，有些人會立刻說「지갑을 잊어버렸어요.」(我忘記了錢包)。但對於「留下~忘記帶走」的情境，更常用的表達是「두고 오다」或「놓고 오다」(落下，left behind)。而「遺失，弄丟」錢包，原本應該說「잃어버렸어요 (遺失了)」，但實際上，有許多韓國人會說成「잊어버렸어요 (忘記了)」。所以如果聽到直接說「잊어버렸어요」，有可能會被誤解為「弄丟錢包」。在「忘在計程車上」，可以使用「택시에 두고 내렸어요」或「택시에서 잃어버렸어요」。"}

{"ID":"232-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"대놓고","漢字源（Hanja）":"","詞性":"副","中文意義":"公然，明顯","韓文例句":"대놓고 싫은 티 내지 마.","例句中文":"不要當場露出嫌棄的表情。","目標中文":"當場","延伸單字":"거리낌 없이 (無所顧忌，肆無忌憚)","詳細解說":"「대놓고」是指「露骨地，明顯地，當面」。例如「대놓고 하다」(大肆進行) 宣傳 (홍보 (弘報)) 或自誇 (자랑)、「대놓고 욕하다 (公然說出惡言)」、「대놓고 막말하다 (當面大聲辱罵)」。當「無法堂堂正正地做某事」時，也可以使用「대놓고 드러내지 못하는 속내 (無法公開表露的真心話)」。「함부로」是不慎重，輕率。「그런 말 함부로 하면 안돼요.」(不可以隨便說出那樣的話。)"}

{"ID":"233-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"은근히","漢字源（Hanja）":"","詞性":"副","中文意義":"暗自，不動聲色地","韓文例句":"저 은근히 애교가 많아요.","例句中文":"我私底下很討人喜歡喔。","目標中文":"私底下","延伸單字":"몰래 (偷偷地)","詳細解說":"「은근히」意指「暗自，私底下，不動聲色地」。例如「은근히 돌려 말하다 (迂迴地說)」、「형은 요리를 은근히 잘해요 (哥私底下很擅長做菜)」。有時也會拿掉「히」，例如「지금 은근 자랑했죠?」(你現在很巧妙地自誇了吧？)，或者「저 은근 섭섭했어요.」(我在心裡暗自難過。)「괜히」意指「不知為何，無謂地」，例如「괜히 말했나 봐요.」(我好像講了無所謂的話=我好像不該講這些話。)"}

{"ID":"234-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"쌔빠지게 일하다","漢字源（Hanja）":"","詞性":"","中文意義":"拼命工作","韓文例句":"쌔빠지게 일만 하는 워커홀릭들.","例句中文":"只知道拼命工作的工作狂們。","目標中文":"拼命工作","延伸單字":"-","詳細解說":"在韓國，無論是偶像、電視劇中的醫生、律師，還是年輕的創業家，都是拼命工作。在這種情況下，常常會使用「쌔빠지다」這個詞。「쌔빠지다 (非常辛苦)」是南部地區的「사투리 (方言)」，用來強調程度。它通常以「쌔빠지게 (拼命地)」的形式使用。例如，「쌔빠지게 고생하다 (拼命吃苦)」或「쌔빠지게 공부 하다 (拼命學習)」。"}

{"ID":"236-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"돈을 아끼다","漢字源（Hanja）":"","詞性":"","中文意義":"省錢","韓文例句":"돈 좀 아껴 쓰세요.","例句中文":"再多省點錢吧。","目標中文":"省點錢","延伸單字":"구두쇠 (小氣鬼) / 짠순이 (囉稱小氣的女性) / 짠돌이 (囉稱小氣的男性)","詳細解說":"「省錢」可以使用「절약하다 (節約-)」，也可以說「돈을 아끼다」。「아끼다」表示「珍惜，不隨意處置」的意思，例如「아껴 쓰는 그릇 (珍惜使用的餐具)」、「아껴 둔다 (珍藏著，留著)」、「내가 아껴둔 아이 스크림 누가 먹었어?」(我特別留下來的冰淇淋，是誰吃掉了？)。「存錢」則是「돈을 모으다」。"}

{"ID":"237-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"탕진하다","漢字源（Hanja）":"蕩盡-","詞性":"動","中文意義":"揮霍","韓文例句":"스마트 워치 샀다. 돈 탕진했네.","例句中文":"我買了智慧型手錶，把錢揮霍完了。","目標中文":"揮霍完了","延伸單字":"탕진잼 (小奢侈)","詳細解說":"「揮霍」是「탕진하다」，或「돈을 많이 쓰다 (花大量的錢)」。「身無分文」則是「빈털터리」，例如「하루 아침에 빈털터리가 되다 (一夜之間變成窮光蛋)」。「낭비 (浪費)」是「돈 낭비 (金錢的浪費)」、「花錢大手大腳」是「돈을 막 쓰다」，「不惜金錢，花錢沒有節制」則是「아낌없이 돈을 쓰다」。「請客」的俗語是「쏘다」，例如「형이 쏜다！」(哥請客！)"}

{"ID":"240-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"눈인사","漢字源（Hanja）":"","詞性":"名","中文意義":"注目禮","韓文例句":"눈이 딱 마주쳐서 눈인사하다.","例句中文":"視線對上了所以行個注目禮。","目標中文":"注目禮","延伸單字":"-","詳細解說":"與世界其他國家相比，韓國的人際距離感相對較近。儘管隨著年齡的增長，人際距離會變遠，但在韓國，朋友之間仍然經常可以看到「손잡다 (牽手)」、「팔짱 끼다 (手勾手)」等看到同性之間出現「어깨동무 (搭肩)」的場面。在韓劇、電影或音樂會現場，也經常出現「업어주기 (背人)」的情景。「擁抱」可以用「안다」、「얼싸안다」或「부둥켜 안다」表達。例如，「형이 안아줄게」意思是「哥給你個擁抱」。「抱起來」可以用「번쩍 들다」或「들어 올리다」表達。例如，「형을 번쩍 들어 버린 막내」意思是「突然把哥哥一把抱起的忙內」。在思考時雙臂交叉的動作也可以稱為「팔짱 끼다」。"}

{"ID":"242-1","章節（PART）":"PART 5 比較一下表達溝通和動作的單字吧","單字（韓文）":"엎드려뻗쳐","漢字源（Hanja）":"","詞性":"感","中文意義":"伏臥 (趴拱橋)","韓文例句":"바닥에 엎드려뻗쳐.","例句中文":"趴到地上。","目標中文":"趴","延伸單字":"-","詳細解說":"「엎드려뻗쳐」是用來下令對做出以雙手支撐地面的「伏臥 (趴拱橋)」姿勢，這種姿勢常在軍隊、學校和家庭中被用作體罰。「伏地挺身」稱為「푸시업 (push-up)」，或「팔굽혀펴기」。當需要用頭部支撐地面時，則會做出「머리 박아」的指示。「박다」意味著「壓住 (臉或頭)，碰撞」。「열중쉬어 (列中-)」意思是「稍息」。過去教室裡會用「차렷, 경례 (立正，敬禮)」作為正式的問候，但因為太具軍事性質，目前也已儘量避免。「倒立」稱為「물구나무서기」，語源似乎不明。上下翻轉，則可以表達為「뒤집다」、「뒤엎다」或「뒤집어엎다」等。「踮腳」稱為「까치발」。其中的「까치」是指「喜鵲」。喜鵲經常出現在故事中，是韓國僅次於老虎 (호랑이) 的代表性生物。支撐牆上架子等的支腳也被稱為「까치발」。"}

{"ID":"246-1","章節（PART）":"PART 6 4個一組比較一下表達狀態的單字吧","單字（韓文）":"크다","漢字源（Hanja）":"","詞性":"形","中文意義":"大","韓文例句":"큰 꽃다발.","例句中文":"一大束花。","目標中文":"大","延伸單字":"-","詳細解說":"韓語形容「身高」並不用「높다 (高) 낮다 (矮)」，而是用「크다 (大) 작다 (小)」來表示，如「키 큰 남자 (個子高的男性)」。「크다」還有「成長、長高」的意思，例如，「키가 크다」是「長高」，「다 크다」則是「變成大人」。「-다랗다」是用來強調形容詞的程度。童話故事《拔蘿蔔》的「大蘿蔔」，就翻譯成「커다란 순무」，而非「큰 순무」。你也可以嘗試使用「조그맣다」(「조그마하다」的縮寫) 來取代「작다」。這個詞可以用於「글씨가 너무 조그매요」(字太小了) 等敘述。在口語中，以濃音來發音會比較容易，例如「쪼그만 글씨」(小字)。「자그마치」則是「至少」的意思。例如：「자그마치 5시간이나 걸린 티켓팅.」(至少花了5個小時才買到票。)"}
,

{"ID":"248-1","章節（PART）":"PART 6 4個一組比較一下表達狀態的單字吧","單字（韓文）":"많다","漢字源（Hanja）":"","詞性":"形","中文意義":"多","韓文例句":"월급이 많다.","例句中文":"薪水很多。","目標中文":"多","延伸單字":"-","詳細解說":"這裡列出「多」和「少」的各種變化。「어마어마하다」，意為「極其，非常，驚人」，因此也可以用來表示「量很多」。你也可以使用「가득하다 (充滿)」來形容，例如「즐거운 일이 가득했으면 좋겠다.」(我希望生活可以充滿樂事。) 當然，也可以改用「잔뜩 (充足地)」或「꽉 (滿滿地)」等副詞來表達。例如：「맛있는 거 잔뜩 사 왔어요.」(我買了一大堆好吃的東西。)「용량이 꽉 찼어요.」(容量已經滿了。) 另外，「쥐꼬리만하다」直譯為「跟老鼠尾巴一樣大小」，常在談論薪水時出現。例如：「이런 쥐꼬리만 한 월급으로어 떻게 살아.」(怎麼可能靠這麼微薄的薪水生活。) 另外，表達「一點點」的「조금」有時會以「쪼끔」或「찌끔」的發音或拼寫方式來強調少量。例如：「쪼끔밖에 안 남았어요.」(只剩下一點點了。)"}

{"ID":"250-1","章節（PART）":"PART 6 4個一組比較一下表達狀態的單字吧","單字（韓文）":"길다","漢字源（Hanja）":"","詞性":"形","中文意義":"長","韓文例句":"긴 바지.","例句中文":"長褲。","目標中文":"長褲","延伸單字":"-","詳細解說":"這裡列出了關於「長」和「短」的變化。比起「긴 줄 (長長的隊伍)」，用「기다란 줄 (長長的隊伍)」形容起來更有感。其他如「기다란 목 (長長的脖子)」、「기다란 국수 (長長麵條)」、「기다란 복도 (長長的走廊)」。「길쭉하다」指的是「相對長」，例如「길쭉한 얼굴 (長臉)」。在談到身高時，除了使用「키」外，也可以用「기럭지」，這是「길이 (長度)」的方言。「짤막하다」也經常用來替代「짧다」，例如：「짤막하게 소개 좀 해 주세요.」(請簡單介紹一下。) 意為「簡短扼要」。相反地，「긴 말」則表示「冗長，囉嗦」。例如：「긴 말 필요 없고 …」(不需要長篇大論……)。然而，「말이 짧다 (話很短)」並非指「沒用敬語」的意思，還請留意。「思慮不周，思考短淺」則是「생각이 짧다 (思考很短)」。"}

{"ID":"252-1","章節（PART）":"PART 6 4個一組比較一下表達狀態的單字吧","單字（韓文）":"넓다","漢字源（Hanja）":"","詞性":"形","中文意義":"寬","韓文例句":"넓은 방.","例句中文":"大房間。","目標中文":"大","延伸單字":"넓이 (面積) / 너비 (寬度)","詳細解說":"「넓다」和「좁다」是用來描述「땅 (土地)」、「공간 (空間)」、「아파트 (公寓)」、「거실 (客廳)」、「마당 (庭院)」、手機或顯示器「화면 (螢幕)」的面積，或是「복도 (走廊)」、「길 (路)」、「칸 (間隔)」的寬度。例如：「칸 넓은 노트 (行距寬的筆記本)」、「자리가 너무 좁다, 좀 만 땡겨 줘.」(座位太窄了，請稍微挪出空間。)「널찍하다」和「널따랗다」是「넓다」的衍生詞，形容「寬敞」，例如：「연습실이 굉장히 널찍하네요.」(練習室非常寬敞)。「너그럽다」則用來描述「心胸寬大」，例如：「너그럽게 이해해 주세요.」(敬請見諒。)「너르다 (寬)」的副詞形式是「널리」，例如：「널리 알려 주세요.」(請廣為宣傳。)「드넓다」用於描述平原和海洋等，例如「드넓은 벌판 (廣大的平原)」、「드넓은 바다 (廣闊的海洋)」。「비좁다」則表示「狹窄」或「狹隘」。例如：「남자 일곱 명에게는 숙소가 너무 비좁아.」(宿舍要塞進七個男生太擁擠了。)「비좁은 공간에 사람 들이 빽빽하게 들어간다.」(人們一個挨一個地擠進狹小的空間裡。)"}

{"ID":"256-1","章節（PART）":"PART 6 4個一組比較一下表達狀態的單字吧","單字（韓文）":"두껍다","漢字源（Hanja）":"","詞性":"形","中文意義":"厚","韓文例句":"두꺼운 지갑.","例句中文":"厚厚的錢包。","目標中文":"厚厚的","延伸單字":"-","詳細解說":"「厚」是「두껍다」，用「두껍다」來描述「豐厚的嘴唇」或「有厚度的肉」可能聽來不太自然。不妨用「두툼하다 (很厚，厚實)」來表達更佳，例如「두툼한 입술 (厚唇)」和「두툼한 삼겹살 (厚切豬五花)」。另外，「粗」也可以用「두껍다」表示，例如：「다리가 두꺼워요. (腿很粗。)」形容手臂、樹枝等「很粗壯」，則可以用「굵직하다」，例如「굵직한 팔다리 (粗壯的手臂和腿)」。"}

{"ID":"258-1","章節（PART）":"PART 6 4個一組比較一下表達狀態的單字吧","單字（韓文）":"뜨겁다","漢字源（Hanja）":"","詞性":"形","中文意義":"滾燙","韓文例句":"뜨거운 물.","例句中文":"滾燙的水。","目標中文":"滾燙的","延伸單字":"-","詳細解說":"不僅有「熱」、「冷」，讓我們一併看看介於兩者之間的表達方式。想表達「溫暖但不過熱」時，可以使用「따뜻하다 (暖和)」，或是「뜨끈뜨끈하다 (暖呼呼)」，例如「뜨끈뜨끈한 온돌방 (暖呼呼的暖炕房)」。也可以用於形容日式暖桌。拼寫類似的「따끈따끈」則是表示「熱騰騰」，例如「따끈따끈한 호떡 (熱騰騰的糖餅)」。「冰涼」是「차갑다」或「차다」，但如果要形容「微溫」，則可以使用「미지근하다」，例如「미지근한 샤워 (微溫的淋浴)」。順道一提，「冰水」是「찬물」，「熱水」則可以說「따뜻한 물 (溫水)」、「뜨거운 물 (熱水)」或「끓는 물 (沸水，即沸騰的水)」。如果是「정수기 (淨水器)」或「수도꼭지 (水龍頭)」的水，則會說「냉수 (冷水)」和「온수 (溫水)」。"}

{"ID":"260-1","章節（PART）":"PART 6 4個一組比較一下表達狀態的單字吧","單字（韓文）":"따뜻하다","漢字源（Hanja）":"","詞性":"形","中文意義":"溫暖","韓文例句":"따뜻한 날씨.","例句中文":"溫暖的天氣。","目標中文":"溫暖的","延伸單字":"-","詳細解說":"「熱」是「덥다」，「溫暖」是「따뜻하다」；如果要在表達「溫暖且舒適」時，也經常使用「포근하다」。例如：「오늘은 날이 포근해 기분 좋아.」(今天的天氣溫暖舒適，心情愉快。) 由於「포근하다」也可以表示柔軟和溫暖的感覺，因此不僅能用於天氣，還可以用於描述「포근한 이불 (蓬鬆的被子)」、「포근한 니트 (柔軟的針織衫)」和「포근한 수면양말 (毛茸茸的襪子)」等。「寒冷」是「춥다」，講到「涼爽」，則很多人可能會想到「시원하다」。常要表達「涼爽且舒適」時，可以使用「시원하다」；但如果要說「有涼意」，則可以使用「쌀쌀하다」。例如：「살짝 쌀쌀한 가을 날씨. 포근한 담요가 필요한 듯.」(稍有涼意的秋天，好像需要一條溫暖的毯子。) 看恐怖電影時「背脊發涼」可以說「오싹하다」；遭遇危險時「嚇到發冷」則是「아찔하다」。"}

{"ID":"262-1","章節（PART）":"PART 6 4個一組比較一下表達狀態的單字吧","單字（韓文）":"빨갛다","漢字源（Hanja）":"","詞性":"形","中文意義":"紅色的","韓文例句":"빨간 눈.","例句中文":"紅眼睛。","目標中文":"紅","延伸單字":"빨강 (紅色)","詳細解說":"「빨갛다」用於描述「사과 (蘋果)」或「장미꽃 (玫瑰花)」等東西的「紅」。例如：「딸기는 빨개요. (草莓是紅色的。)」「얼굴이 빨개졌어요. (臉紅了。)」「발그레하다」表示「輕微泛紅」，可用於描述「발그레한 볼 (微紅的臉頰)」和「발그레한 입술 (微紅的嘴唇)」等。「하얗다」用於描述「하얀 눈 (白雪)」、「하얀 이 (白牙齒)」、「하얀 머리 (白髮)」、「하얀 피부 (白皮膚)」、「하얀 종이 (白紙)」等。「하얗다」也可以替換為「희다」。為了和「바나나 우유 (香蕉牛奶)」或「커피 우유 (咖啡牛奶)」區分，有時人們會稱「普通的牛奶」為「흰 우유 (白色牛奶)」。「뿌옇다」表示「白茫茫，霧茫茫」，例如「뿌연 입김 (白色的呼氣)」、「뿌연 안개 (白色的霧)」、「뿌연 렌즈 (模糊的鏡頭)」、「뿌연 시야 (朦朧的視野)」。「純屬謊言」在韓語中稱作「새빨간 거짓말 (鮮紅的謊言)」，但「善意的謊言」則稱為「하얀 거짓말 (白色的謊言)」。"}

{"ID":"264-1","章節（PART）":"PART 6 4個一組比較一下表達狀態的單字吧","單字（韓文）":"파랗다","漢字源（Hanja）":"","詞性":"形","中文意義":"藍色的","韓文例句":"파란 하늘.","例句中文":"藍天。","目標中文":"藍","延伸單字":"파랑 (藍色)","詳細解說":"「파랗다」用於描述從藍色到綠色的範圍，例如「파란 하늘 (藍天)」、「파란 물감 (藍色的顏料)」和「파란 신호 (藍燈號)」。同時，「파랗다」也可以用來表示「不成熟」，例如「새파란 젊은이 (青年新手)」。「푸르다」也表示從藍色到綠色的範圍，但相對於「파랗다」更偏向綠色。例如「푸른 사과 (青蘋果)」、「푸른 솔 (新綠的五月)」和「푸른 산 (翠綠的山脈)」。太空人尤里·加加林的名言「The earth was bluish. (地球是藍的)」則是「지구는 푸른 빛이었다」。「노란 우산 (黃傘)」、「노란 병아리 (黃色小雞)」等的「黃色」則是「노랗다」。代表韓國春天的黃色花朵是「개나리꽃 (金雀花)」。「노란 리본 (黃色緞帶)」運動象徵了祈禱戰場倖存者歸來，也在世越號沉沒事故後傳開。「呈現黃色的，泛黃的」則是「누렇다」，例如「누런 벼 (黃澄澄的稻穗)」、「흰 옷이 누레지다 (白色衣物泛黃)」。 「蛋白」是「흰자」，「蛋黃」則是「노른자 (黃黃的)」。「하늘이 노랗다 (天空是黃色的)」和「하늘이 캄캄하다 (天空是漆黑的)」則表示「絕望」。"}

{"ID":"266-1","章節（PART）":"PART 6 4個一組比較一下表達狀態的單字吧","單字（韓文）":"달다","漢字源（Hanja）":"","詞性":"形","中文意義":"甜","韓文例句":"달다 달아.","例句中文":"啊～好甜。","目標中文":"好甜","延伸單字":"-","詳細解說":"讓我們擴展一下關於味道的詞彙表達。「甜」是「달다」，而原本是方言的「달달하다 (甜美)」目前也廣泛用於日常用語中。《愛的迫降》中，女主角尹世理 (孫藝珍飾) 渴望「달달한 것 (甜食)」，咀嚼著巧克力的畫面令人印象深刻。不僅適用於食物，還可用於描述香氣，例如「달달한 목소리 (甜美的聲音)」、「달달한 속삭임 (甜蜜的耳語)」、「달달한 노래 (甜美的歌曲)」。以上也都可以替換為「달콤하다」。「苦」的則是「쓰다」。例如「크윽 쓰다. (唉～苦呀)」是在一口烈酒下肚後不禁吐出的一句話。「苦」也可以表示「辛苦」，所以「苦澀的人生」在韓語中可以說成「씁쓸한 인생」。其他例子包括「씁쓸한 표정 (苦澀的臉)」和「씁쓸한 웃음 (苦笑)」。「苦澀的回憶」的新造語在韓語中也稱為「흑역사 (黑歷史)」。「감 (柿子)」和「우엉 (牛蒡)」等食材的「澀味，苦澀味」則是「떫은맛」。"}

{"ID":"268-1","章節（PART）":"PART 6 4個一組比較一下表達狀態的單字吧","單字（韓文）":"맵다","漢字源（Hanja）":"","詞性":"形","中文意義":"辣","韓文例句":"매운 음식도 잘 드세요?","例句中文":"你有辦法吃辣嗎？","目標中文":"辣","延伸單字":"-","詳細解說":"由於韓國有許多「매운맛 (辛辣)」的料理，因此「辣」的表達方式非常豐富。「찜닭 (燉雞)」和「닭발 (辣雞腳)」等紅色的料理，被描述為「매콤한 맛 (美味的辣)」；芥末和辣椒等調味料則被描述為「톡 쏘는 맛 (刺激的辣)」。描述紅通通的燉菜或鍋品則會使用「얼큰한 맛 (辣呼呼的辣)」。例如：「얼큰한 국물 먹고 싶네요. (好想喝辣辣的湯。)」喝著辣湯時說「아~시원하다」，則表示「辣得很痛快」。年輕一代喜歡的「떡볶이 (辣炒年糕)」和「양념치킨 (洋釀炸雞)」等「甜中帶辣」的食物，則是用「매콤달콤하다」來形容。如果想「가시게 하다 (中和)」辣味，推薦搭配牛奶。像檸檬一樣的「酸味」稱為「신맛」，「酸酸甜甜」的味道則是「새콤달콤하다」。常用於形容水果，如「감귤 (橘子)」、「자두 (李子)」和「키위 (奇異果)」等。「酸酸甜甜的初戀回憶」是「새콤달콤 첫사랑의 추억」。「새콤달콤」同時也是某種軟糖的品牌名稱。"}
,

{"ID":"270-1","章節（PART）":"PART 6 4個一組比較一下表達狀態的單字吧","單字（韓文）":"짜다","漢字源（Hanja）":"","詞性":"形","中文意義":"鹹","韓文例句":"짠 음식.","例句中文":"味道偏鹹的食物，重口味的食物。","目標中文":"鹹的","延伸單字":"-","詳細解說":"韓國料理以看起來紅通通的外觀聞名，導致大家普遍認為韓國人喜歡重口味，但實際上很多人不喜歡過鹹(짠맛)的味道。「이건 짠 정도가 아니라… (這不是普通的鹹……)」。適中的鹹味是「짭짤한 맛」，如「햄 (火腿)」、「김 (海苔)」、「팝콘 (爆米花)」等。「달콤한 과자와 짭짤한 과자」就是「甜的零食和鹹的零食」。「鹹甜味」則是「단짠단짠」的味道。「鹹度」也被稱為「소금기」。相反地，表達「味道淡」的詞彙則是「싱겁다」。例如：「싱거우면 간장에 찍어 먹어요. (如果味道太淡，就蘸一些醬油吃。)」另一方面，表達「單調」的「밋밋하다」和表達「無聊」的「심심하다」也可以用來形容「味道淡，乏味」。「味道，鹹度」稱為「간」，例如「간이 짜다 (味道很鹹)」和「간이 싱겁다 (味道很淡)」。還有其他詞彙如「간이 맞다 (味道剛好)」、「간을 보다 (試味道)」，以及「간을 맞추다 (調整味道)」，不妨一併記住。"}
,
